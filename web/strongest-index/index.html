<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>最强指数</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/hanako-glass.css">
<style>
  /* ── 布局 ── */
  .layout { display:flex; gap:16px; align-items:flex-start; }
  .left { width:320px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; }
  .right { flex:1; min-width:0; display:flex; flex-direction:column; gap:16px; }

  /* ── 日期行 ── */
  .date-row { display:flex; gap:8px; }
  .date-row .fld { flex:1; }
  .fld label { display:block; font-size:10px; font-weight:500; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em; }
  .fld input { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:10px; font-size:12px; background:rgba(26,26,31,.4); color:var(--text-primary); font-family:var(--font-body); outline:none; transition:all .2s; box-sizing:border-box; }
  .fld input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(245,158,11,.1); }

  /* ── 参数卡片 ── */
  .param-card { background:var(--card); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:14px; padding:0; overflow:hidden; box-shadow:var(--shadow-card); }
  .param-card-hd { display:flex; align-items:center; gap:8px; padding:10px 14px; cursor:pointer; font-family:var(--font-display); font-size:13px; font-weight:400; color:#d4d4d8; }
  .param-card-bd { padding:10px 14px 12px; }
  .param-card-bd.collapsed { display:none; }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  /* ── 滑块通用 ── */
  input[type=range] { height:4px; -webkit-appearance:none; appearance:none; background:var(--border); border-radius:2px; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--accent); cursor:pointer; }

  /* ── 滑块行 ── */
  .sr { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .sr .sl { font-size:11px; color:var(--muted); min-width:64px; }
  .sr input[type=range] { flex:1; }
  .sr .sv { font-size:11px; font-weight:500; color:var(--text-primary); min-width:40px; text-align:right; }

  /* ── 开关行 ── */
  .tog-row { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  .tog-row .sl { font-size:11px; color:var(--muted); min-width:64px; }
  .switch { position:relative; width:22px; height:12px; border-radius:6px; border:none; cursor:pointer; transition:background .2s; flex-shrink:0; }
  .switch.on { background:var(--accent); }
  .switch.off { background:rgba(255,255,255,.15); }
  .switch::after { content:''; position:absolute; top:1px; width:10px; height:10px; border-radius:50%; background:#FFF; transition:left .2s; box-shadow:0 1px 2px rgba(0,0,0,.15); }
  .switch.on::after { left:11px; }
  .switch.off::after { left:1px; }

  /* ── 按钮 ── */
  .btn-run { display:block; width:100%; padding:11px; background:var(--accent-subtle); color:var(--accent); border:1px solid var(--accent-border); border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font-body); transition:all .2s; }
  .btn-run:hover { background:rgba(245,158,11,.18); }
  .btn-run:disabled { opacity:.4; cursor:not-allowed; }
  .btn-save { display:block; width:100%; padding:9px; margin-top:0; background:transparent; color:var(--muted); border:1px solid var(--border); border-radius:10px; font-size:12px; cursor:pointer; font-family:var(--font-body); transition:all .2s; }
  .btn-save:hover { color:#d4d4d8; border-color:var(--border-hover); }
  .btn-save.saved { color:var(--rise); border-color:var(--accent-border); }

  /* ── 结果区域 ── */
  .pool-section { margin-bottom:16px; }
  .pool-title { font-family:var(--font-display); font-size:14px; font-weight:400; color:#d4d4d8; margin-bottom:8px; }

  /* ── 表格 ── */
  .table-wrapper { overflow-x:auto; max-height:500px; overflow-y:auto; }
  table { width:100%; border-collapse:collapse; font-size:11px; }
  th, td { padding:5px 8px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { font-size:10px; font-weight:500; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; cursor:pointer; user-select:none; }
  th:hover { color:var(--text-primary); }
  td { font-weight:300; }
  tbody tr:hover td { background:rgba(255,255,255,.02); }

  /* ── 筛选按钮 ── */
  .pool-btn { padding:4px 10px; border:1px solid var(--border); border-radius:20px; background:var(--card); color:var(--text-secondary); font-size:10px; cursor:pointer; font-family:var(--font-body); transition:all .15s; }
  .pool-btn:hover { border-color:var(--accent); color:var(--accent); }
  .pool-btn.active { background:var(--accent); color:#FFF; border-color:var(--accent); }

  /* ── 响应式 ── */
  @media (max-width:900px) { .layout { flex-direction:column; } .left { width:100%; } }

  /* ═══ 浅色模式 ═══ */
  html[data-theme="light"] .param-card-hd { color:#374151; }
  html[data-theme="light"] .param-card { background:rgba(255,255,255,.75); }
  html[data-theme="light"] .pool-title { color:#374151; }
  html[data-theme="light"] .fld input { background:rgba(255,255,255,.7); border-color:var(--divider); color:var(--text-primary); }
  html[data-theme="light"] .sr .sv { color:var(--text-primary); }
  html[data-theme="light"] td { border-bottom-color:rgba(0,0,0,.03); }
  html[data-theme="light"] tbody tr:hover td { background:rgba(0,0,0,.02); }
  html[data-theme="light"] .switch.off { background:rgba(0,0,0,.1); }
  html[data-theme="light"] .btn-save { color:var(--muted); }
  html[data-theme="light"] .btn-save:hover { color:#374151; }
  html[data-theme="light"] .pool-btn { background:rgba(255,255,255,.75); }
  html[data-theme="light"] input[type="date"] { color-scheme:light; }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<script>(function(){var c=document.getElementById("bg-canvas"),w=c.width=window.innerWidth,h=c.height=window.innerHeight;var ctx=c.getContext("2d"),N=60;var p=[];for(var i=0;i<N;i++)p.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,o:Math.random()*.4+.1});function draw(){ctx.clearRect(0,0,w,h);for(var i=0;i<N;i++){var P=p[i];P.x+=P.vx;P.y+=P.vy;if(P.x<0)P.x=w;if(P.x>w)P.x=0;if(P.y<0)P.y=h;if(P.y>h)P.y=0;ctx.beginPath();ctx.arc(P.x,P.y,P.r,0,Math.PI*2);ctx.fillStyle="rgba(245,158,11,"+P.o+")";ctx.fill()}for(var i=0;i<N;i++){for(var j=i+1;j<N;j++){var dx=p[i].x-p[j].x,dy=p[i].y-p[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){ctx.beginPath();ctx.moveTo(p[i].x,p[i].y);ctx.lineTo(p[j].x,p[j].y);ctx.strokeStyle="rgba(245,158,11,"+((100-dist)/100*.06)+")";ctx.stroke()}}}requestAnimationFrame(draw)}draw();window.addEventListener("resize",function(){w=c.width=window.innerWidth;h=c.height=window.innerHeight})})();</script>

<div class="app-container">
  <nav id="top-nav"></nav>

  <div class="layout">
    <div class="left">
      <!-- 日期 -->
      <div class="glass-card">
        <div class="chart-title" style="font-size:14px;margin-bottom:6px;">📅 日期</div>
        <div class="date-row"><div class="fld"><input type="date" id="target-date"></div></div>
      </div>

      <!-- RS强度条件 -->
      <div class="param-card" id="card-rs">
        <div class="param-card-hd" onclick="toggleCard('card-rs')">
          <span class="dot" style="background:var(--rise)"></span>
          🔴 RS强度条件
        </div>
        <div class="param-card-bd" id="card-rs-bd">
          <div class="tog-row">
            <span class="sl">RS_250</span>
            <button class="switch on" id="c-rs250-on" onclick="event.stopPropagation();tog('c-rs250-on')"></button>
            <span style="font-size:11px;color:var(--muted);margin-left:auto">≥</span>
            <input type="range" id="c-rs250" min="60" max="99" value="80" oninput="syncNum('c-rs250')" style="width:80px">
            <span class="sv" id="c-rs250-v">80</span>
          </div>
          <div class="tog-row">
            <span class="sl">RS_60</span>
            <button class="switch on" id="c-rs60-on" onclick="event.stopPropagation();tog('c-rs60-on')"></button>
            <span style="font-size:11px;color:var(--muted);margin-left:auto">≥</span>
            <input type="range" id="c-rs60" min="60" max="99" value="85" oninput="syncNum('c-rs60')" style="width:80px">
            <span class="sv" id="c-rs60-v">85</span>
          </div>
          <div class="tog-row">
            <span class="sl">RS_20</span>
            <button class="switch on" id="c-rs20-on" onclick="event.stopPropagation();tog('c-rs20-on')"></button>
            <span style="font-size:11px;color:var(--muted);margin-left:auto">≥</span>
            <input type="range" id="c-rs20" min="60" max="99" value="90" oninput="syncNum('c-rs20')" style="width:80px">
            <span class="sv" id="c-rs20-v">90</span>
          </div>
        </div>
      </div>

      <!-- 均线排列 -->
      <div class="param-card" id="card-ma">
        <div class="param-card-hd" onclick="toggleCard('card-ma')">
          <span class="dot" style="background:#10b981"></span>
          🟢 均线排列
        </div>
        <div class="param-card-bd" id="card-ma-bd">
          <div class="tog-row">
            <span class="sl">MA多头排列</span>
            <button class="switch on" id="c-ma-on" onclick="event.stopPropagation();tog('c-ma-on')"></button>
            <span style="font-size:10px;color:var(--muted)">MA50 &gt; MA150 &gt; MA200</span>
          </div>
        </div>
      </div>

      <!-- AD线 -->
      <div class="param-card" id="card-ad">
        <div class="param-card-hd" onclick="toggleCard('card-ad')">
          <span class="dot" style="background:var(--accent)"></span>
          🟠 AD线
        </div>
        <div class="param-card-bd" id="card-ad-bd">
          <div class="tog-row">
            <span class="sl">AD斜率&gt;0</span>
            <button class="switch on" id="c-ad-on" onclick="event.stopPropagation();tog('c-ad-on')"></button>
            <span style="font-size:10px;color:var(--muted)">20日A/D线斜率&gt;0</span>
          </div>
        </div>
      </div>

      <!-- 自动放宽 -->
      <div class="param-card" id="card-relax">
        <div class="param-card-hd" onclick="toggleCard('card-relax')">
          <span class="dot" style="background:#a855f7"></span>
          🟣 自动放宽
        </div>
        <div class="param-card-bd" id="card-relax-bd">
          <div class="tog-row">
            <span class="sl">自动放宽</span>
            <button class="switch on" id="c-relax-on" onclick="event.stopPropagation();tog('c-relax-on')"></button>
          </div>
          <div class="sr">
            <span class="sl">放宽步长</span>
            <input type="range" id="c-relax-step" min="1" max="10" value="5" oninput="syncNum('c-relax-step')">
            <span class="sv" id="c-relax-step-v">5</span>
          </div>
        </div>
      </div>

      <button class="btn-run" id="btn-run">🔍 运行筛选</button>
      <button class="btn-save" id="btn-save">💾 保存配置</button>
    </div>

    <div class="right"><div id="results"></div></div>
  </div>
</div>

<script src="../shared/js/echarts.min.js"></script>
<script src="../shared/js/api-client.js"></script>
<script>
  const SIGNAL_TYPE='strongest_index';

  function toggleCard(id){ document.getElementById(id+'-bd').classList.toggle('collapsed'); }
  function tog(id){ const b=document.getElementById(id); b.classList.toggle('on'); b.classList.toggle('off'); }
  function syncNum(id){ const e=document.getElementById(id), v=document.getElementById(id+'-v'); if(e&&v)v.textContent=e.value; }

  document.addEventListener('DOMContentLoaded', async()=>{
    const now=new Date();
    document.getElementById('target-date').value=now.toISOString().split('T')[0];
    document.getElementById('btn-run').addEventListener('click', runFilter);
    document.getElementById('btn-save').addEventListener('click', saveConfig);
    await loadConfig();
    setTimeout(runFilter, 500);
  });

  function getParams(){
    return {
      conditions:{
        rs_250:{ enabled:document.getElementById('c-rs250-on').classList.contains('on'), threshold:parseInt(document.getElementById('c-rs250').value) },
        rs_60:{ enabled:document.getElementById('c-rs60-on').classList.contains('on'), threshold:parseInt(document.getElementById('c-rs60').value) },
        rs_20:{ enabled:document.getElementById('c-rs20-on').classList.contains('on'), threshold:parseInt(document.getElementById('c-rs20').value) },
        ma_align:{ enabled:document.getElementById('c-ma-on').classList.contains('on') },
        ad_slope:{ enabled:document.getElementById('c-ad-on').classList.contains('on') },
      },
      auto_relax:document.getElementById('c-relax-on').classList.contains('on'),
      relax_step:parseInt(document.getElementById('c-relax-step').value),
    };
  }

  async function runFilter(){
    const btn=document.getElementById('btn-run');
    btn.disabled=true; btn.textContent='⏳ 计算中...';
    try{
      const date=document.getElementById('target-date').value;
      const resp=await fetch(API_BASE+'/api/strongest-index?date='+date+'&params='+encodeURIComponent(JSON.stringify(getParams())));
      const d=await resp.json();
      renderResults(d);
      btn.textContent='🔄 重新筛选';
    }catch(e){ console.error(e); btn.textContent='❌ 失败'; }
    btn.disabled=false;
  }

  function renderResults(d){
    const div=document.getElementById('results');
    if(!d||!d.pools){ div.innerHTML='<div style="padding:32px;text-align:center;color:var(--muted)">暂无数据</div>'; return; }

    const pools=d.pools;
    const pmeta={ market:{n:'全市场指数',icon:'🏛'}, sector_l1:{n:'一级行业',icon:'🏭'}, sector_l2:{n:'二级行业',icon:'🔧'}, thematic:{n:'主题指数',icon:'🎯'}, strategy:{n:'策略指数',icon:'🧩'} };
    let html='';

    for(const [pk,pd] of Object.entries(pools)){
      const m=pmeta[pk]||{n:pk,icon:'📦'};
      const relaxed=pd.relaxed?'<span style="font-size:10px;color:var(--accent);font-family:var(--font-body);font-weight:500">（已放宽RS_20至≥'+pd.applied_rs20+'）</span>':'';

      html+='<div class="pool-section glass-card">';
      html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">';
      html+='<span style="font-family:var(--font-display);font-size:14px;font-weight:400;color:#d4d4d8">'+m.icon+' '+m.n+' '+relaxed+'</span>';
      html+='<span style="font-size:10px;color:var(--muted);font-family:var(--font-body)">Top '+pd.top_n+' · '+pd.indices.length+'/'+pd.total+' 达标</span>';
      html+='</div>';

      if(!pd.indices||!pd.indices.length){
        html+='<div style="padding:20px;text-align:center;color:var(--muted)">无符合条件的指数</div>';
      }else{
        html+='<div class="table-wrapper"><table><thead><tr>';
        ['#','代码','名称','RS_20','RS_60','RS_250','MA50','MA200','AD斜率'].forEach(function(h){
          html+='<th>'+h+'</th>';
        });
        html+='</tr></thead><tbody>';
        pd.indices.forEach(function(s,i){
          html+='<tr>';
          html+='<td>'+(i+1)+'</td>';
          html+='<td style="font-weight:600">'+s.code+'</td>';
          html+='<td>'+s.name+'</td>';
          html+='<td style="color:var(--rise);font-weight:700">'+s.rs_20+'</td>';
          html+='<td>'+s.rs_60+'</td>';
          html+='<td>'+s.rs_250+'</td>';
          html+='<td>'+(s.ma50||0).toFixed(0)+'</td>';
          html+='<td>'+(s.ma200||0).toFixed(0)+'</td>';
          html+='<td>'+(s.ad_slope>0?'+':'')+(s.ad_slope||0).toFixed(0)+'</td>';
          html+='</tr>';
        });
        html+='</tbody></table></div>';
      }
      html+='</div>';
    }

    // 全量复核表格
    const all=d.all_indices||[];
    if(all.length){
      html+='<div class="glass-card" style="margin-top:16px">';
      html+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">';
      html+='<span style="font-family:var(--font-display);font-size:14px;font-weight:400;color:#d4d4d8">📋 全部指数复核表</span>';
      html+='<span style="font-size:10px;color:var(--muted);font-family:var(--font-body)">'+all.length+'个指数</span>';
      html+='</div>';
      html+='<div style="padding:4px 0 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">';
      html+='<input id="idx-search" placeholder="搜索代码或名称…" style="padding:6px 12px;border:1px solid var(--border);border-radius:10px;font-size:11px;background:rgba(26,26,31,.4);color:var(--text-primary);width:180px;font-family:var(--font-body);outline:none" oninput="filterIdxTable()">';
      ['全部','市场指数','一级行业','二级行业','主题指数','策略指数'].forEach(function(t){
        html+='<button class="pool-btn" onclick="filterByIdxPool(\''+t+'\',this)">'+t+'</button>';
      });
      html+='</div>';
      html+='<div class="table-wrapper"><table id="idx-table"><thead><tr>';
      ['#','代码','名称','类型','RS_20','RS_60','RS_250','20日收益','60日收益','MA50','MA200','AD斜率'].forEach(function(h){
        html+='<th>'+h+'</th>';
      });
      html+='</tr></thead><tbody>';
      all.forEach(function(s,i){
        html+='<tr data-pool="'+s.pool+'">';
        html+='<td>'+(i+1)+'</td>';
        html+='<td style="font-weight:600">'+s.code+'</td>';
        html+='<td>'+s.name+'</td>';
        html+='<td style="font-size:10px;color:var(--muted)">'+s.pool+'</td>';
        html+='<td style="color:var(--rise);font-weight:700">'+s.rs_20+'</td>';
        html+='<td>'+s.rs_60+'</td>';
        html+='<td>'+s.rs_250+'</td>';
        html+='<td>'+(s.ret_20>=0?'+':'')+s.ret_20+'%</td>';
        html+='<td>'+(s.ret_60>=0?'+':'')+s.ret_60+'%</td>';
        html+='<td>'+s.ma50+'</td>';
        html+='<td>'+s.ma200+'</td>';
        html+='<td>'+(s.ad_slope>0?'+':'')+s.ad_slope+'</td>';
        html+='</tr>';
      });
      html+='</tbody></table></div></div>';
    }
    div.innerHTML=html;
  }

  function filterIdxTable(){
    const q=(document.getElementById('idx-search').value||'').toLowerCase();
    const activePool=document.getElementById('idx-search').dataset.pool||'';
    document.querySelectorAll('#idx-table tbody tr').forEach(function(tr){
      const matchPool=!activePool||activePool==='全部'||tr.dataset.pool===activePool;
      const matchSearch=!q||tr.children[1].textContent.includes(q)||tr.children[2].textContent.toLowerCase().includes(q);
      tr.style.display=(matchPool&&matchSearch)?'':'none';
    });
  }

  function filterByIdxPool(pool, btn){
    document.getElementById('idx-search').dataset.pool=pool;
    document.querySelectorAll('.pool-btn').forEach(function(b){ b.classList.remove('active'); });
    if(btn)btn.classList.add('active');
    filterIdxTable();
  }

  async function loadConfig(){
    try{
      const r=await fetch(API_BASE+'/api/config?signal_type='+SIGNAL_TYPE,{cache:'no-store'});
      const cfg=await r.json();
      if(!cfg||!cfg.conditions)return;
      console.log('配置已加载',cfg);
      const c=cfg.conditions;
      if(c.rs_250){ setTog('c-rs250-on',c.rs_250.enabled!==false); setVal('c-rs250',c.rs_250.threshold||80); }
      if(c.rs_60){ setTog('c-rs60-on',c.rs_60.enabled!==false); setVal('c-rs60',c.rs_60.threshold||85); }
      if(c.rs_20){ setTog('c-rs20-on',c.rs_20.enabled!==false); setVal('c-rs20',c.rs_20.threshold||90); }
      if(c.ma_align)setTog('c-ma-on',c.ma_align.enabled!==false);
      if(c.ad_slope)setTog('c-ad-on',c.ad_slope.enabled!==false);
      setTog('c-relax-on',cfg.auto_relax!==false);
      setVal('c-relax-step',cfg.relax_step||5);
    }catch(e){ console.error('加载配置失败:',e); }
  }

  function setTog(id,on){ const b=document.getElementById(id); if(!b)return; b.className='switch '+(on?'on':'off'); }
  function setVal(id,v){ const e=document.getElementById(id); if(!e)return; e.value=v; syncNum(id); }

  async function saveConfig(){
    const btn=document.getElementById('btn-save');
    btn.textContent='⏳ 保存中...'; btn.disabled=true;
    const p=getParams();
    const y=[
      '# 最强指数参数配置','',
      'conditions:',
      '  rs_250:',
      '    enabled: '+(p.conditions.rs_250.enabled?'true':'false'),
      '    threshold: '+p.conditions.rs_250.threshold,
      '  rs_60:',
      '    enabled: '+(p.conditions.rs_60.enabled?'true':'false'),
      '    threshold: '+p.conditions.rs_60.threshold,
      '  rs_20:',
      '    enabled: '+(p.conditions.rs_20.enabled?'true':'false'),
      '    threshold: '+p.conditions.rs_20.threshold,
      '  ma_align:',
      '    enabled: '+(p.conditions.ma_align.enabled?'true':'false'),
      '  ad_slope:',
      '    enabled: '+(p.conditions.ad_slope.enabled?'true':'false'),
      'auto_relax: '+(p.auto_relax?'true':'false'),
      'relax_step: '+p.relax_step,
      '',
    ].join('\n');
    try{
      const r=await fetch(API_BASE+'/api/config?signal_type='+SIGNAL_TYPE,{method:'POST',headers:{'Content-Type':'text/plain'},body:y});
      const d=await r.json();
      if(d.ok){
        btn.textContent='✅ 已保存'; btn.classList.add('saved');
        setTimeout(function(){ btn.textContent='💾 保存配置'; btn.classList.remove('saved'); btn.disabled=false; },2000);
      }
    }catch(e){ btn.textContent='❌ 失败'; btn.disabled=false; }
  }
</script>

<script>
  Nav.init({brandIcon:"⭐",brandText:"最强指数回测",currentPage:"strongest-index"});

  function toggleTheme(){
    var h=document.documentElement, n=h.dataset.theme==='dark'?'light':'dark';
    h.dataset.theme=n; localStorage.setItem('theme',n);
  }
  (function(){
    var s=localStorage.getItem('theme')||'dark';
    document.documentElement.dataset.theme=s;
  })();
</script>
