<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0d0d12">
<title>投资决策驾驶舱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/css/hanako-glass.css">
<style>
body{font-family:var(--font-body);background:var(--bg);color:var(--text-primary)}
.page-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.page-header h1{font-family:var(--font-display);font-size:1.2rem;font-weight:400;color:var(--text-primary)}
.page-header .meta{font-size:.65rem;color:var(--muted)}

/* 顶部控制栏 */
.control-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.control-bar input[type=date]{padding:6px 10px;border:1px solid var(--border);border-radius:10px;font-size:11px;background:var(--card);color:var(--text-primary);outline:none;width:130px}
.control-bar input[type=date]:focus{border-color:var(--accent)}
.btn-glass{padding:6px 14px;border:1px solid var(--accent-border);border-radius:10px;background:var(--accent-subtle);color:var(--accent);cursor:pointer;font-size:11px;font-weight:500;font-family:var(--font-body)}
.btn-glass:hover{background:rgba(245,158,11,.18)}
.btn-glass.sm{padding:4px 10px;font-size:10px}
.btn-glass.sm.on{background:var(--accent);color:#0d0d12;border-color:var(--accent);font-weight:600}

/* Tab */
.tab-bar{display:flex;gap:0;margin-bottom:10px;border-bottom:1px solid var(--border)}
.tab-btn{padding:8px 20px;font-size:.8rem;font-family:var(--font-display);cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;transition:all .2s}
.tab-btn:hover{color:var(--text-primary)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.tab-btn .cnt{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:8px;font-size:.58rem;background:var(--accent-subtle);color:var(--accent)}

/* 流程提示 */
.flow-hint{font-size:.62rem;color:var(--muted);margin-bottom:8px;padding:6px 12px;border-radius:8px;background:var(--accent-subtle);border:1px solid var(--accent-border)}

/* 卡片 */
.signal-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:8px;box-shadow:var(--shadow-card);cursor:pointer;transition:border-color .2s}
.signal-card:hover{border-color:rgba(245,158,11,.3)}
.signal-card .top-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.signal-card .stock-info{font-family:var(--font-display);font-size:.9rem;color:var(--text-primary)}
.signal-card .stock-info a{color:var(--accent);text-decoration:none}
.signal-card .stock-info .code{font-size:.62rem;color:var(--muted);margin-left:5px;font-family:var(--font-mono)}
.signal-card .node-line{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:9px;font-family:var(--font-mono);color:var(--text-secondary)}
.node-dot{display:inline-block;width:7px;height:7px;border-radius:50%}
.nd-H{background:#ef4444}.nd-L{background:#10b981}.nd-C{background:var(--accent)}.nd-B1{background:#3b82f6}.nd-B2{background:#a78bfa}

.badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:10px;font-weight:600;font-family:var(--font-mono)}
.badge-attn{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.badge-attn-hi{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.badge-score{background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.2)}
.badge-score-hi{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.25)}
.badge-pos{background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.2)}
.badge-pos-lg{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3);font-size:11px}

.signal-card .key-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:.65rem}
.key-stats .kstat{text-align:center}
.key-stats .kstat .kv{font-family:var(--font-display);font-weight:700;font-size:.75rem}
.key-stats .kstat .kl{font-size:.52rem;color:var(--muted)}

/* 展开明细 */
.expand{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.expand table{width:100%;border-collapse:collapse;font-size:10px}
.expand td{padding:2px 8px;font-family:var(--font-mono)}
.expand .lbl{color:var(--muted);width:90px;font-size:9px}
.expand .val{color:var(--text-primary);font-size:9px}
.expand .ok{color:#10b981}
.expand .no{color:var(--muted)}

/* 仓位建议条 */
.position-bar{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 12px;border-radius:8px;font-size:.62rem}
.position-bar.heavy{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2)}
.position-bar.standard{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2)}
.position-bar.light{background:rgba(26,26,31,.3);border:1px solid var(--border)}

.empty-state{text-align:center;padding:40px;color:var(--muted);font-family:var(--font-display)}

html[data-theme="light"] .signal-card{background:rgba(255,255,255,.75)}
html[data-theme="light"] .control-bar input{background:rgba(255,255,255,.7)}
</style>
</head>
<body>
<div class="app-container">
<nav id="top-nav"></nav>

<div class="page-header">
  <h1>🚀 投资决策驾驶舱</h1>
  <span class="meta" id="meta-info">加载中...</span>
</div>

<div class="control-bar">
  <span style="font-size:10px;color:var(--muted)">信号日期</span>
  <input type="date" id="signal-date" onchange="loadDate()">
  <button class="btn-glass sm" onclick="loadToday()">📅 最新</button>
  <span style="font-size:10px;color:var(--muted);margin-left:8px" id="flow-label"></span>
  <button class="btn-glass sm" onclick="toggleTheme()" style="margin-left:auto" title="切换深浅色">🌓</button>
</div>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('b1')" id="tab-b1">🔔 高关注B1 <span class="cnt" id="cnt-b1">0</span></button>
  <button class="tab-btn" onclick="switchTab('b2')" id="tab-b2">✅ B2确认 <span class="cnt" id="cnt-b2">0</span></button>
  <button class="tab-btn" onclick="switchTab('cup')" id="tab-cup">☕ 杯柄信号 <span class="cnt" id="cnt-cup">0</span></button>
</div>

<div class="flow-hint" id="flow-hint"></div>
<div id="signals"></div>
<div id="cup-signals" style="display:none"></div>
</div>

<script src="../shared/js/nav.js"></script>
<script>Nav.init({brandIcon:'🚀',brandText:'驾驶舱',currentPage:'cockpit'})</script>

<script>
var API='http://'+window.location.hostname+':8788';
var allSignals=[],currentTab='b1',currentDate='';
var cupData={signals:[],candidates:[],date:'',latest_date:'',fallback:false};
var cupView='signal';

function switchTab(t){
  currentTab=t;
  ['b1','b2','cup'].forEach(function(k){
    document.getElementById('tab-'+k).classList.toggle('active',t===k);
  });
  document.getElementById('signals').style.display = (t==='cup')?'none':'';
  document.getElementById('cup-signals').style.display = (t==='cup')?'':'none';
  if(t==='cup') renderCup(); else render();
}

function loadToday(){
  var d=new Date(); d.setHours(d.getHours()+8);
  var today=d.toISOString().slice(0,10);
  document.getElementById('signal-date').value=today;
  loadDate();
}

async function loadDate(){
  var d=document.getElementById('signal-date').value;
  if(!d) return;
  currentDate=d;
  document.getElementById('meta-info').textContent='加载中...';
  
  // 加载 B1 和 B2 信号
  var [b1r,b2r,cupr]=await Promise.all([
    fetch(API+'/api/mw/signals?type=b1&start='+d+'&end='+d).then(r=>r.json()),
    fetch(API+'/api/mw/signals?type=b2&start='+d+'&end='+d).then(r=>r.json()),
    fetch(API+'/api/cockpit/cup-handle?date='+d).then(r=>r.json()).catch(()=>({signals:[],candidates:[]}))
  ]);

  allSignals=(b1r.signals||[]).map(function(s){s._tab='b1';return s;})
    .concat((b2r.signals||[]).map(function(s){s._tab='b2';return s;}));

  cupData=cupr||{signals:[],candidates:[],counts:{}};
  document.getElementById('cnt-cup').textContent=(cupData.signals||[]).length;

  var meta=((b1r.signals||[]).length+(b2r.signals||[]).length)+'个MW信号';
  document.getElementById('meta-info').textContent=d+' · '+meta;
  if(currentTab==='cup') renderCup(); else render();
}

function getPosition(s,isB2){
  if(!isB2) return null;
  var sc=s.score||0;
  var dec=s.decline_pct||0;
  if(sc>=70) return {level:'heavy',text:'重仓',reason:'MW形态≥70'};
  if(sc>=50 && dec>40) return {level:'heavy',text:'重仓',reason:'形态≥50 + 回调>40%'};
  if(sc>=50) return {level:'standard',text:'标准仓',reason:'MW形态≥50'};
  if(dec>40) return {level:'standard',text:'标准仓',reason:'回调>40%'};
  return {level:'light',text:'轻仓',reason:'形态<50且回调≤40%'};
}

function getAttnTier(ts){
  if(ts>=70) return {label:'极高',cls:'badge-attn'};
  if(ts>=60) return {label:'高',cls:'badge-attn-hi'};
  return {label:'关注',cls:''};
}

function render(){
  var isB2=currentTab==='b2';
  
  // 筛选
  var filtered=allSignals.filter(function(s){
    if(isB2){
      // B2 Tab: 只显示有 B2 确认且日期匹配的
      return s._tab==='b2' && currentTab==='b2';
    }else{
      // B1 Tab: 只显示关注度≥80 的 B1
      return s._tab==='b1' && (s.tech_score||0)>=50;
    }
  });
  
  // 排序
  filtered.sort(function(a,b){
    if(isB2) return (b.score||0)-(a.score||0);     // B2按MW评分降序
    return (b.tech_score||0)-(a.tech_score||0);      // B1按关注度降序
  });
  
  // 更新计数
  var b1cnt=allSignals.filter(function(s){return s._tab==='b1'&&(s.tech_score||0)>=50;}).length;
  var b2cnt=allSignals.filter(function(s){return s._tab==='b2';}).length;
  document.getElementById('cnt-b1').textContent=b1cnt;
  document.getElementById('cnt-b2').textContent=b2cnt;
  
  // 流程提示
  var hint=isB2
    ? 'B2已确认 → 按MW形态评分决定仓位 → 重仓(≥70) / 标准仓(50~69或回调>40%) / 轻仓(<50且浅回调)'
    : 'B1高关注 → 加入观察池 → 等待B2确认（不出B2不买）';
  document.getElementById('flow-hint').textContent='📋 '+hint;
  
  var el=document.getElementById('signals');
  if(!filtered.length){
    var emptyMsg=isB2
      ? '今日暂无B2确认信号'
      : '今日暂无关注分≥50的B1信号';
    el.innerHTML='<div class="empty-state">'+emptyMsg+'</div>';
    return;
  }
  
  el.innerHTML=filtered.map(function(s,i){
    var hasB2=s.b2_date&&s.b2_date>s.b1_date;
    var ts=s.tech_score||0;
    var attn=getAttnTier(ts);
    var pos=getPosition(s,isB2);
    var sc=s.score||0;
    var conf=s.confidence||'低';
    
    // 展开明细
    var detailHTML='';
    if(isB2){
      detailHTML='<table>'+
        '<tr><td class="lbl">MW形态分</td><td class="val ok">'+sc+'/100 ('+conf+')</td>'+
          '<td class="lbl">I2个股RS</td><td class="val '+(s.score_i2?'ok':'no')+'">'+(s.score_i2||0)+'/30</td></tr>'+
        '<tr><td class="lbl">D调整深度</td><td class="val '+(s.score_d?'ok':'no')+'">'+(s.score_d||0)+'/25</td>'+
          '<td class="lbl">I1行业RS</td><td class="val '+(s.score_i1?'ok':'no')+'">'+(s.score_i1||0)+'/20</td></tr>'+
        '<tr><td class="lbl">H前高趋势</td><td class="val '+(s.score_h?'ok':'no')+'">'+(s.score_h||0)+'/15</td>'+
          '<td class="lbl">Sig共振</td><td class="val '+(s.score_sig?'ok':'no')+'">'+(s.score_sig||0)+'/10</td></tr>'+
      '</table>';
    }else{
      detailHTML='<table>'+
        '<tr><td class="lbl">关注度</td><td class="val ok">'+ts+'/100 ('+attn.label+')</td>'+
          '<td class="lbl">前高RS</td><td class="val">'+(s.h_rs250||'—')+'</td></tr>'+
        '<tr><td class="lbl">回调深度</td><td class="val">'+(s.decline_pct!=null?s.decline_pct.toFixed(1)+'%':'—')+'</td>'+
          '<td class="lbl">B1涨幅</td><td class="val">'+(s.b1_return_pct!=null?'+'+s.b1_return_pct.toFixed(1)+'%':'—')+'</td></tr>'+
      '</table>';
    }
    
    // 仓位条（仅B2）
    var posHTML='';
    if(pos){
      posHTML='<div class="position-bar '+pos.level+'">'+
        '<span style="font-weight:700;font-size:.7rem">💰 '+pos.text+'</span>'+
        '<span style="color:var(--muted)">'+pos.reason+'</span></div>';
    }
    
    return '<div class="signal-card" onclick="toggleExpand('+i+')">'+
      '<div class="top-row">'+
        '<span class="stock-info"><a href="../pattern-scan/?code='+s.stock_code+'" target="_blank">'+(s.stock_name||s.stock_code)+'</a><span class="code">'+s.stock_code+'</span></span>'+
        (isB2
          ? '<span class="badge '+(sc>=70?'badge-score-hi':'badge-score')+'">MW '+sc+'/'+conf+'</span>'
          : '<span class="badge '+attn.cls+'">👁 '+ts+'/'+attn.label+'</span>')+
      '</div>'+
      '<div class="node-line">'+
        '<span class="node-dot nd-H"></span> H '+s.h_date+
        ' <span style="color:var(--muted)">→</span> '+
        '<span class="node-dot nd-L"></span> L '+s.l_date+
        ' <span style="color:var(--muted)">→</span> '+
        '<span class="node-dot nd-B1"></span> B1 '+s.b1_date+' +'+(s.b1_return_pct||0).toFixed(1)+'%'+
        (hasB2 ? ' <span style="color:var(--muted)">→</span> <span class="node-dot nd-B2"></span> B2 '+s.b2_date+' +'+(s.b2_return_pct||0).toFixed(1)+'%' : '')+
      '</div>'+
      '<div class="key-stats">'+
        '<div class="kstat"><div class="kv">'+(s.h_rs250||'—')+'</div><div class="kl">前高RS</div></div>'+
        '<div class="kstat"><div class="kv">'+(s.decline_pct!=null?s.decline_pct.toFixed(1)+'%':'—')+'</div><div class="kl">回调深度</div></div>'+
        (s.ind_name ? '<div class="kstat"><div class="kv">'+s.ind_name+'</div><div class="kl">行业</div></div>' : '')+
        (hasB2 ? '<div class="kstat"><div class="kv">'+(s.b2_return_pct!=null?'+'+s.b2_return_pct.toFixed(1)+'%':'—')+'</div><div class="kl">B2涨幅</div></div>' : '')+
      '</div>'+
      posHTML+
      '<div class="expand" id="exp-'+i+'">'+detailHTML+
        '<div style="margin-top:8px">'+
          '<a href="../pattern-scan/?code='+s.stock_code+'" target="_blank" style="font-size:10px;color:var(--accent);text-decoration:none">🔍 形态复核</a>'+
          '<span style="margin:0 8px">|</span>'+
          '<a href="../mw-signals/" target="_blank" style="font-size:10px;color:var(--accent);text-decoration:none">📋 MW信号页</a>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function toggleCupView(v){
  cupView=v;
  renderCup();
}

// 形态复核链接：以信号日为锚点往前 18 个月。用 UTC 构造避免 toISOString 在东八区
// 把日期回退一天；月份溢出（3/31 往前 18 个月）按当月最后一天夹取。
function reviewLink(r){
  var p=(r.date||'').split('-');
  var back=new Date(Date.UTC(+p[0], +p[1]-1-18, 1));
  var last=new Date(Date.UTC(back.getUTCFullYear(), back.getUTCMonth()+1, 0)).getUTCDate();
  back.setUTCDate(Math.min(+p[2], last));
  var start=back.toISOString().slice(0,10);
  return '../pattern-scan/?code='+r.stock_code+'&start='+start+'&end='+r.date;
}

function renderCup(){
  var list=(cupView==='signal'?cupData.signals
           :cupView==='confirm'?cupData.confirms
           :cupData.candidates)||[];
  var nSig=(cupData.signals||[]).length, nCand=(cupData.candidates||[]).length;
  var nConf=(cupData.confirms||[]).length;

  document.getElementById('cnt-cup').textContent=nSig;

  var hint='☕ 杯柄形态 → 柄部缩量小幅回调 → 放量突破杯口当日轻仓（买点=杯口价×1.01，不突破不买入）→ 次日仍站稳杯口之上则加仓';
  if(cupData.fallback){
    hint='⚠️ '+currentDate+' 无杯柄记录，已回退显示最近交易日 '+cupData.date;
  }else if(cupData.date){
    hint='☕ '+cupData.date+'　'+hint.slice(2);
  }
  document.getElementById('flow-hint').textContent=hint;

  var el=document.getElementById('cup-signals');
  var head='<div style="display:flex;gap:8px;margin:10px 0">'+
    '<button class="btn-glass sm'+(cupView==='signal'?' on':'')+'" onclick="toggleCupView(\'signal\')">🚀 突破信号 '+nSig+'</button>'+
    '<button class="btn-glass sm'+(cupView==='confirm'?' on':'')+'" onclick="toggleCupView(\'confirm\')">➕ 确认加仓 '+nConf+'</button>'+
    '<button class="btn-glass sm'+(cupView==='candidate'?' on':'')+'" onclick="toggleCupView(\'candidate\')">👀 观察候选 '+nCand+'</button>'+
    '</div>';

  if(!list.length){
    el.innerHTML=head+'<div class="empty-state">'+
      (cupView==='signal'?'当日无杯柄放量突破信号'
       :cupView==='confirm'?'当日无确认加仓信号':'当日无新的杯柄观察候选')+'</div>';
    return;
  }

  el.innerHTML=head+list.map(function(r,i){
    var isSig=r.record_type==='SIGNAL', isConf=r.record_type==='CONFIRM';
    var link=reviewLink(r);
    var detail='<table>'+
      '<tr><td class="lbl">买点</td><td class="val ok">'+r.buy_point+
        '</td><td class="lbl">目标/止损</td><td class="val">'+r.target_price+' / '+r.stop_price+'</td></tr>'+
      '<tr><td class="lbl">前高</td><td class="val">'+r.prior_high_price+' ('+r.prior_high_date+')</td>'+
        '<td class="lbl">杯底</td><td class="val">'+r.bottom_price+' ('+r.bottom_date+')</td></tr>'+
      '<tr><td class="lbl">杯口</td><td class="val">'+r.mouth_price+' ('+r.mouth_date+')</td>'+
        '<td class="lbl">柄低</td><td class="val">'+r.handle_low_price+' ('+r.handle_low_date+')</td></tr>'+
      '<tr><td class="lbl">杯口/前高</td><td class="val">'+(r.mouth_vs_high!=null?r.mouth_vs_high.toFixed(3):'—')+'</td>'+
        '<td class="lbl">前置上涨</td><td class="val">'+(r.prior_advance_pct!=null?r.prior_advance_pct.toFixed(1)+'%':'—')+'</td></tr>'+
      '<tr><td class="lbl">柄部对MA10</td><td class="val '+(r.ma10_held?'ok':'no')+'">'+
        (r.hd_min_ma10!=null?r.hd_min_ma10.toFixed(3):'—')+(r.ma10_held?' 守住':' 破位')+'</td>'+
        '<td class="lbl">杯底振幅</td><td class="val">'+(r.bottom_amp!=null?(r.bottom_amp*100).toFixed(1)+'%':'—')+'</td></tr>'+
      '</table>'+
      '<div style="margin-top:8px">'+
        '<a href="'+link+'" target="_blank" style="font-size:10px;color:var(--accent);text-decoration:none">🔍 形态复核</a>'+
        '<span style="margin:0 8px">|</span>'+
        '<span style="font-size:10px;color:var(--muted)">建议持有 '+r.suggested_max_hold+' 个交易日</span>'+
      '</div>';

    return '<div class="signal-card" onclick="toggleExpand(\'c'+i+'\')">'+
      '<div class="top-row">'+
        '<span class="stock-info"><a href="'+link+'" target="_blank">'+(r.stock_name||r.stock_code)+
          '</a><span class="code">'+r.stock_code+'</span></span>'+
        '<span class="badge '+(isSig?'badge-score-hi':isConf?'badge-pos':'badge-score')+'">'+
          (isSig?'🚀 突破·轻仓':isConf?'➕ 确认·加仓':'👀 候选')+'</span>'+
      '</div>'+
      '<div class="node-line">'+
        '<span class="node-dot nd-H"></span> 前高 '+r.prior_high_price+
        ' <span style="color:var(--muted)">→</span> '+
        '<span class="node-dot nd-L"></span> 杯底 '+r.bottom_price+
        ' <span style="color:var(--muted)">→</span> '+
        '<span class="node-dot nd-B1"></span> 杯口 '+r.mouth_price+
        ' <span style="color:var(--muted)">→</span> '+
        '<span class="node-dot nd-B2"></span> 买点 '+r.buy_point+
      '</div>'+
      '<div class="key-stats">'+
        '<div class="kstat"><div class="kv">'+(r.depth_pct!=null?r.depth_pct.toFixed(1)+'%':'—')+'</div><div class="kl">杯身深度</div></div>'+
        '<div class="kstat"><div class="kv">'+(r.handle_dd_pct!=null?r.handle_dd_pct.toFixed(1)+'%':'—')+'</div><div class="kl">柄部回撤</div></div>'+
        '<div class="kstat"><div class="kv">'+r.handle_days+'</div><div class="kl">柄部天数</div></div>'+
        '<div class="kstat"><div class="kv">'+(r.breakout_vol_ratio!=null?r.breakout_vol_ratio.toFixed(2):'—')+
          '</div><div class="kl">突破量比</div></div>'+
      '</div>'+
      '<div class="expand" id="exp-c'+i+'">'+detail+'</div>'+
    '</div>';
  }).join('');
}

function toggleExpand(i){
  var el=document.getElementById('exp-'+i);
  el.style.display=el.style.display==='block'?'none':'block';
}

function toggleTheme(){
  var h=document.documentElement;
  var n=h.dataset.theme==='dark'?'light':'dark';
  h.dataset.theme=n;localStorage.setItem('theme',n);
}
(function(){var s=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=s})();

// 支持 ?tab=cup / ?tab=b2 直达，便于从日报或其它页面链接过来
var _wantTab=new URLSearchParams(location.search).get('tab');
loadToday();
if(_wantTab && ['b1','b2','cup'].indexOf(_wantTab)>=0) switchTab(_wantTab);
</script>
