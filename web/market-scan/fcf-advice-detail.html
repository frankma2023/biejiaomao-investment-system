<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>自由现金流指数操作建议详情</title>
<link rel="stylesheet" href="/shared/css/hanako-glass.css">
<link rel="stylesheet" href="/shared/css/advice-card.css">
<script src="/shared/js/advice-card.js"></script>
<script src="/shared/js/nav.js"></script>
<script src="/shared/js/api-client.js"></script>
<style>
:root{--bg:#0e0e12;--card:#1b1b21;--line:#2a2a33;--txt:#e9e9ec;--mut:#8f8f97;
      --amber:#f59e0b;--risk:#ef4444;--good:#10b981;--blue:#539BF5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
     font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 70px}
.nav{display:flex;gap:14px;align-items:center;padding:10px 0 18px;font-size:13px;color:var(--mut)}
.nav a{color:var(--mut);text-decoration:none}
.nav a:hover{color:var(--amber)}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin:0 0 18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
      padding:16px 18px;margin:0 0 16px}
.card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reasons{margin:12px 0 0;padding-left:20px;color:#c8c8ce;font-size:13.5px}
.reasons li{margin:4px 0}
.chart{width:100%}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
tr.cur{background:rgba(245,158,11,.09)}
.gaps{background:#141418;border:1px solid rgba(239,68,68,.35);
      border-radius:12px;padding:14px 18px;margin:0 0 16px}
.gaps b{color:var(--risk)}
.gaps ul{margin:8px 0 0;padding-left:20px;color:#c8c8ce;font-size:13px}
.tag{display:inline-block;font-size:11px;color:var(--mut);border:1px solid var(--line);
     border-radius:99px;padding:2px 9px}
.note{color:var(--mut);font-size:12.5px;margin-top:8px;line-height:1.75}

.back{display:inline-block;font-size:13px;color:#a1a1aa;text-decoration:none;margin:0 0 14px}
.back:hover{color:#f59e0b}
.err{color:var(--risk);padding:30px;text-align:center}
@media(max-width:760px){
  h1{font-size:19px}
  .card{padding:13px 14px}
  .wrap{padding:16px 12px 50px}
  table{font-size:12px}
  th,td{padding:6px 6px}
}
</style>
</head>
<body>
<nav id="top-nav"></nav>
<div class="wrap">
  <a class="back" href="/market-scan/red-dividend/">← 返回指数投资</a>
  <div style="display:flex;justify-content:flex-end"><a id="vmode" href="?code=980092&view=full" style="font-size:12px;color:#a1a1aa"></a></div>
  <h1>国证自由现金流 · 操作建议详情</h1>
  <p class="sub" id="sub">加载中…</p>
  <div id="root"></div>
</div>
<script src="/shared/js/echarts.min.js"></script>
<script>
const q = new URLSearchParams(location.search);
const CODE = q.get('code') || '980092';
const DATE = q.get('date') || '';
const VIEW = q.get('view') || 'full';
const LVCLS = {low:'lv-low', neutral:'lv-neutral', high:'lv-high', reduce:'lv-reduce'};

document.getElementById('vmode').href =
  `?code=${CODE}&view=${VIEW === 'compact' ? 'full' : 'compact'}` +
  (DATE ? `&date=${DATE}` : '');
document.getElementById('vmode').textContent =
  VIEW === 'compact' ? '切到完整版' : '切到紧凑版';

const card = html => `<div class="card">${html}</div>`;

function render(d) {
  const a = d.advice, m = a.meta;
  // 全收益序列尾部可能缺失，取最后一个有效值；缺失则退回价格回撤
  const lastValid = (arr) => { for (let i = arr.length - 1; i >= 0; i--) { if (arr[i] != null) return arr[i]; } return null; };
  const curDD = lastValid(d.dd_series_tr) ?? lastValid(d.dd_series) ?? 0;
  const curRsi = d.rsi_series[d.rsi_series.length - 1].rsi60;
  const curR20 = (function () {
    const m20 = (d.rsi_multi || []).find(x => x.period === 20);
    return m20 ? m20.series[m20.series.length - 1] : null;
  })();
  const ex = m.excess_pp;
  const exColor = ex == null ? 'var(--mut)' : (ex >= 0 ? 'var(--good)' : 'var(--risk)');
  const segWarn = (m.independent_segments != null && m.independent_segments <= 4);

  // 1 建议卡
  // ── 1. 建议卡（走 shared/js/advice-card.js 的共用组件） ──
  const buy = a.buy_score ?? 0;
  const risk = a.risk_score ?? 0;
  const riskFactors = (a.score_detail || []).filter(d => d.risk);
  const riskBreadth = riskFactors.filter(d => d.value >= 30).length;

  // 回撤参考点：由回撤序列反推参考高点（全收益尾部可能缺失，取最后有效值）
  const ddTr = d.dd_series_tr || d.dd_series || [];
  let hiIdx = ddTr.length - 1;
  for (let k = ddTr.length - 1; k >= 0; k--) {
    if (ddTr[k] != null && ddTr[k] <= 0.001) { hiIdx = k; break; }
  }
  let curPoint = null;
  if (d.closes_tr) {
    for (let k = d.closes_tr.length - 1; k >= 0; k--) {
      if (d.closes_tr[k] != null) { curPoint = d.closes_tr[k]; break; }
    }
  }
  if (curPoint == null) curPoint = d.closes[d.closes.length - 1];
  const hiPoint = (curPoint != null && curDD > 0) ? curPoint / (1 - curDD / 100) : curPoint;
  const f2 = v => v == null ? '—' : v.toFixed(2);

  let h = window.renderAdviceCard({
    level: a.level, label: a.label, reasons: a.reasons,
    buyScore: buy, riskScore: risk,
    scoreDetail: (a.score_detail || []).map(function (d) {
      return {factor: d.factor, desc: d.desc, value: d.value, note: d.note, risk: d.risk};
    }),
    breadth: {hit: riskBreadth, total: riskFactors.length || 2,
              text: `广度 =${riskBreadth}，风险分 ${risk}，买入分 ${buy}`},
    noteBox: {
      title: '回撤参考点', subtitle: '全收益口径',
      rows: [
        ['参考高点', f2(hiPoint) + '（' + d.dates[hiIdx] + '）'],
        ['当前点位', f2(curPoint)],
        ['回撤幅度', f2(hiPoint) + ' − ' + f2(curPoint) + ' ) ÷ ' + f2(hiPoint) +
                    ' = <span style="color:#f59e0b">' + curDD.toFixed(1) + '%</span>']
      ]
    },
    footer: '该档中位年化 <b>' +
      (m.median_annual == null ? '—' : m.median_annual.toFixed(2) + '%') + '</b>' +
      ' · 全样本中位 <b>' + (m.median_annual_all ?? 16.43).toFixed(2) + '%</b>' +
      ' · 独立段 <b>' + (m.independent_segments == null ? '—' : m.independent_segments) + '</b>' +
      ' · 数据源 <b>' + (a.source === 'index_advice_daily'
          ? '日更表 ' + a.advice_date : '实时计算') + '</b>'
  });
  let out = h;

  // 2 价格 + 买点时间线
  out += card(`<h3>价格走势 + 买点信号时间线
    <span class="tag">2012-12-31 起 13.68 年 · 锚定回撤≥20%</span></h3>
    <div id="c-price" class="chart" style="height:360px"></div>
    <div class="note">⚡ = 锚定回撤每次进入 20% 档的日期（跌破再回升会重新标记），历史共 ${d.buy_points.length} 次。
    红线为锚定回撤%（全收益口径），可用下方滑块缩放。</div>`);

  // 3 RSI 买卖点（紧凑版隐藏）
  if (VIEW !== 'compact') {
    out += card(`<h3>RSI 买卖点
      <span class="tag">RSI6 / RSI14 / RSI20 · 点图例切换</span></h3>
      <div id="c-rsi" class="chart" style="height:380px"></div>
      <div class="note">买点＝RSI 跌破 30 后的每段最低点；卖点＝RSI 升破该周期阈值（RSI6/14 为 80，RSI20 为 78）后的每段最高点。满足阈值就全部标注，不截断。★ 为更极端档（买 &lt;20 / 卖 ≥85）。
      灰线为价格（右轴），用来看标记是否真落在价格高低点。<br>
      <b>为什么默认显示 RSI14</b>：三个周期的 &lt;30 天数分别是 344 / 81 / 36 天，
      RSI14 密度适中；RSI60 的 &lt;30 天数为 <b>0</b>，标不出任何买点，故不展示。</div>`);
  }

  // 3b 备选版式：价格/全收益主图 + RSI 副图（双面板，十字线联动）
  if (VIEW !== 'compact') {
    out += card(`<h3>📐 备选版式：价格 / 全收益主图
      <span class="tag">归一化 · 与 RSI 双面板联动</span></h3>
      <div id="c-alt" class="chart" style="height:680px"></div>
      <div class="note">两线均按可见区间起点归一化为 100，<b>间距 = 累计分红再投贡献</b>。
      RSI 副图默认只显示 RSI14，点图例切换周期。十字线贯穿两个面板，滑块同步缩放。<br>
      <b>蓝钉 = 买点</b>（RSI 跌破 30 后每段最低点，跌破 20 加深）；<b>绿三角 = 卖点</b>（升破该周期阈值后每段最高点：RSI6/14 为 80、RSI20 为 78；≥阈值+5 加深）。</div>`);
  }

  // 4 回撤分档
  const rows = d.dd_bins.map(b => {
    const cur = b.lo <= curDD && curDD < b.hi;
    const c = b.annual >= (m.median_annual_all ?? 16.43) ? 'var(--good)' : 'var(--risk)';
    const segStyle = b.segments <= 4 ? 'color:var(--risk);font-weight:700' : '';
    return `<tr${cur ? ' class="cur"' : ''}><td>${b.label}${cur ? ' ← 当前' : ''}</td>
      <td style="color:${c}">${b.annual.toFixed(2)}%</td>
      <td style="color:${b.excess_pp >= 0 ? 'var(--good)' : 'var(--risk)'}">${b.excess_pp >= 0 ? '+' : ''}${b.excess_pp.toFixed(2)}pp</td>
      <td style="${segStyle}">${b.segments}</td></tr>`;
  }).join('');
  out += card(`<h3>回撤分档对照
    <span class="tag">买入并持有至期末的年化</span></h3>
    <div class="tw"><table>
      <thead><tr><th>回撤档</th><th>中位年化</th><th>vs 全样本中位</th><th>独立段</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <div class="note"><b>口径</b>：本表「中位年化」是该档内所有入场日买入并持有至期末的年化中位数，
    对照基准为<b>全样本入场日中位 ${(m.median_annual_all ?? 16.43).toFixed(2)}%</b>。
    另有一个常被混用的数字「一直持有 ${m.baseline_annual.toFixed(2)}%」——
    那是单点买入的复合增长率，与中位数不是同一个统计量，两者差 0.13pp。<br>
    独立段数 ≤4 的档位标红——<b>样本太薄，不能当规则用。</b></div>`);

  // 4b 估值全景（口径受限：仅 2024-09 起 501 个交易日）
  if (VIEW !== 'compact') {
    out += card(`<h3>估值全景
      <span class="tag">PE-TTM / PB / 股息率 · 近 2 年分位</span></h3>
      <div id="c-val" class="chart" style="height:520px"></div>
      <div class="note"><b>⚠ 口径与红利页不同：</b>980092 的估值数据只有
      <b>2024-09-18 起 501 个交易日</b>，所以这里是<b>近 2 年分位</b>，不是十年分位。
      分位越低越便宜（PE/PB），股息率分位越高越便宜。
      <br>指数层面的 <b>ROE / EPS / 营业收入 / 净利润 / 营业利润率 / 净利润率</b>
      在本地库中没有对应数据表，因此不展示。</div>`);
  }

  // 5 数据缺口
  out += `<div class="gaps"><b>⚠ 数据缺口声明</b><ul>
    ${d.data_gaps.map(g => `<li>${g}</li>`).join('')}</ul></div>`;

  document.getElementById('root').innerHTML = out;
  drawPrice(d);
  if (VIEW !== 'compact') { drawRsi(d); drawAlt(d); drawVal(d); }
}

function gopt(bottom) {
  return {left:'8%', right:'4%', top:16, bottom: bottom || 24};
}

function drawPrice(d) {
  const el = document.getElementById('c-price');
  if (!el) return;
  const c = echarts.init(el);
  // 全区间展示（2012-12-31 起）：2015-06~2016-01 的最大回撤是深跌结论的唯一证据，
  // 截成近 10 年会把整段腰斩剪掉。用户可用下方滑块自行缩放。
  const start = 0;
  const dates = d.dates.slice(start);
  const px = d.closes.slice(start);
  const dd = (d.dd_series_tr || d.dd_series).slice(start);
  const pts = d.buy_points.filter(b => b.date >= dates[0]).map(b => ({
    coord: [b.date, d.closes[d.dates.indexOf(b.date)]],
    value: '⚡', itemStyle: {color: '#ef4444'}
  }));
  c.setOption({
    backgroundColor: 'transparent',
    tooltip: {trigger: 'axis'},
    legend: {data: ['价格', '锚定回撤%(全收益)'], textStyle: {color: '#8f8f97', fontSize: 11},
             top: 0, right: 8},
    grid: gopt(46),
    xAxis: {type: 'category', data: dates,
            axisLabel: {color: '#8f8f97', fontSize: 10},
            axisLine: {lineStyle: {color: '#2a2a33'}}},
    yAxis: [
      {type: 'value', name: '点位', axisLabel: {color: '#8f8f97', fontSize: 10},
       splitLine: {lineStyle: {color: '#2a2a33'}}},
      {type: 'value', name: '回撤%', max: 60,
       axisLabel: {color: '#8f8f97', fontSize: 10}, splitLine: {show: false}}
    ],
    dataZoom: [{type: 'inside'}, {type: 'slider', height: 14, bottom: 8}],
    series: [
      {name: '价格', type: 'line', data: px, smooth: true, showSymbol: false,
       lineStyle: {color: '#539BF5', width: 1.6},
       markPoint: {data: pts, symbol: 'pin', symbolSize: 34}},
      {name: '锚定回撤%(全收益)', type: 'line', yAxisIndex: 1, data: dd, smooth: true,
       showSymbol: false, lineStyle: {color: '#ef4444', width: 1.2, opacity: .75},
       areaStyle: {color: 'rgba(239,68,68,.07)'}}
    ]
  });
}

function drawRsi(d) {
  const el = document.getElementById('c-rsi');
  if (!el || !d.rsi_multi || !d.rsi_multi.length) return;
  const c = echarts.init(el);
  const per = d.rsi_multi;
  const defP = d.rsi_default_period || 14;
  const COL = {6: '#f59e0b', 14: '#539BF5', 20: '#a855f7'};
  const dates = d.dates;

  const series = [], legend = [];
  per.forEach(function (m) {
    const col = COL[m.period] || '#f59e0b';
    const on = m.period === defP;
    legend.push('RSI' + m.period);

    // 满足阈值就全部标注，不人为截断；阈值本身已收窄到「明显极值」。
    // 满足阈值就全部标注，不人为截断；阈值本身已收窄到「明显极值」。
    const buys = (m.buy_marks || []).map(function (x) {
      const deep = x.tier === 1;
      return {coord: [x.date, x.rsi], value: x.tier_label,
              symbol: deep ? 'pin' : 'circle',
              symbolSize: deep ? 22 : 12,
              itemStyle: {color: col, borderColor: '#fff', borderWidth: deep ? 1 : 0},
              label: {show: true, formatter: x.tier_label, color: '#fff',
                      fontSize: 8, position: 'top'}};
    });
    const sells = (m.sell_marks || []).map(function (x) {
      const deep = x.tier === 1;
      return {coord: [x.date, x.rsi], value: x.tier_label,
              symbol: 'triangle', symbolRotate: 180,
              symbolSize: deep ? 14 : 11,
              itemStyle: {color: deep ? '#10b981' : 'rgba(16,185,129,.7)',
                          borderColor: '#fff', borderWidth: deep ? 1 : 0},
              label: {show: true, formatter: x.tier_label, color: '#fff',
                      fontSize: 8, position: 'bottom'}};
    });

    series.push({
      name: 'RSI' + m.period, type: 'line', data: m.series,
      smooth: true, showSymbol: false,
      lineStyle: {color: col, width: 1.2, opacity: on ? 1 : .5},
      itemStyle: {color: col},
      // 阈值线随 series 常驻：图例切到任一周期都能看到它自己的买卖线。
      markLine: {silent: true, symbol: 'none', data: [
        {yAxis: m.buy_threshold, lineStyle: {color: '#ef4444', type: 'dashed',
                                             width: 1, opacity: on ? .9 : .5},
         label: {formatter: 'RSI' + m.period + ' 买 ' + m.buy_threshold,
                 color: '#ef4444', fontSize: 9, position: 'insideStartTop'}},
        {yAxis: m.sell_threshold, lineStyle: {color: '#10b981', type: 'dashed',
                                              width: 1, opacity: on ? .9 : .5},
         label: {formatter: 'RSI' + m.period + ' 卖 ' + m.sell_threshold,
                 color: '#10b981', fontSize: 9, position: 'insideStartBottom'}}
      ]},
      markPoint: {data: buys.concat(sells),
                  symbolSize: 8, label: {show: false}},
      z: on ? 5 : 3
    });
  });

  // 价格线（右轴），用来校验标记是否落在价格低/高点
  series.push({
    name: '价格', type: 'line', yAxisIndex: 1, data: d.closes,
    smooth: true, showSymbol: false,
    lineStyle: {color: '#6b7280', width: 1, opacity: .55}, z: 1
  });

  c.setOption({
    backgroundColor: 'transparent',
    tooltip: {trigger: 'axis'},
    legend: {data: legend.concat(['价格']), selected: (function () {
      const s = {}; per.forEach(function (m) { s['RSI' + m.period] = m.period === defP; });
      s['价格'] = true; return s;
    })(),
      textStyle: {color: '#8f8f97', fontSize: 11}, top: 0, right: 8},
    grid: gopt(64),
    xAxis: {type: 'category', data: dates,
            axisLabel: {color: '#8f8f97', fontSize: 10},
            axisLine: {lineStyle: {color: '#2a2a33'}}},
    yAxis: [
      {type: 'value', name: 'RSI', min: 0, max: 100,
       axisLabel: {color: '#8f8f97', fontSize: 10},
       splitLine: {lineStyle: {color: '#2a2a33'}}},
      {type: 'value', name: '点位', max: function (v) { return v.max * 1.15; },
       axisLabel: {color: '#8f8f97', fontSize: 10}, splitLine: {show: false}}
    ],
    dataZoom: [{type: 'inside'}, {type: 'slider', height: 14, bottom: 8}],
    series: series
  });
}


function drawAlt(d) {
  const el = document.getElementById('c-alt');
  if (!el || !d.rsi_multi || !d.rsi_multi.length) return;
  const c = echarts.init(el);
  const per = d.rsi_multi;
  const defP = d.rsi_default_period || 14;
  const COL = {6: '#f59e0b', 14: '#539BF5', 20: '#a855f7'};
  const dates = d.dates;

  // 归一化基准：可见区间起点（默认全区间，取第一个有效值）
  const trRaw = d.closes_tr || d.closes;
  const baseP = d.closes[0], baseT = (trRaw.find ? trRaw.find(x => x != null) : trRaw[0]);
  const px = d.closes.map(x => x == null ? null : +(x / baseP * 100).toFixed(2));
  const tri = (trRaw || []).map(x => x == null ? null : +(x / baseT * 100).toFixed(2));

  const series = [
    {name: '价格', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: px,
     smooth: true, showSymbol: false, lineStyle: {color: '#6b7280', width: 1.4}, z: 2},
    {name: '全收益', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: tri,
     smooth: true, showSymbol: false, lineStyle: {color: '#f59e0b', width: 1.8}, z: 3}
  ];

  const legend = ['价格', '全收益'], selected = {'价格': true, '全收益': true};

  per.forEach(function (m) {
    const col = COL[m.period] || '#f59e0b';
    const on = m.period === defP;
    legend.push('RSI' + m.period);
    selected['RSI' + m.period] = on;

    const buys = (m.buy_marks || []).map(function (x) {
      const deep = x.tier === 1;
      return {coord: [x.date, x.rsi], value: x.tier_label,
              symbol: deep ? 'pin' : 'circle', symbolSize: deep ? 20 : 11,
              itemStyle: {color: col, borderColor: '#fff', borderWidth: deep ? 1 : 0},
              label: {show: true, formatter: x.tier_label, color: '#fff',
                      fontSize: 8, position: 'top'}};
    });
    const sells = (m.sell_marks || []).map(function (x) {
      const deep = x.tier === 1;
      return {coord: [x.date, x.rsi], value: x.tier_label,
              symbol: 'triangle', symbolRotate: 180, symbolSize: deep ? 13 : 10,
              itemStyle: {color: deep ? '#10b981' : 'rgba(16,185,129,.7)',
                          borderColor: '#fff', borderWidth: deep ? 1 : 0},
              label: {show: true, formatter: x.tier_label, color: '#fff',
                      fontSize: 8, position: 'bottom'}};
    });

    series.push({
      name: 'RSI' + m.period, type: 'line', xAxisIndex: 1, yAxisIndex: 1,
      data: m.series, smooth: true, showSymbol: false,
      lineStyle: {color: col, width: 1.2, opacity: on ? 1 : .5},
      itemStyle: {color: col},
      // 阈值线随 series 常驻：图例切到任一周期都能看到它自己的买卖线。
      markLine: {silent: true, symbol: 'none', data: [
        {yAxis: m.buy_threshold, lineStyle: {color: '#ef4444', type: 'dashed',
                                             width: 1, opacity: on ? .9 : .5},
         label: {formatter: 'RSI' + m.period + ' 买 ' + m.buy_threshold,
                 color: '#ef4444', fontSize: 9, position: 'insideStartTop'}},
        {yAxis: m.sell_threshold, lineStyle: {color: '#10b981', type: 'dashed',
                                              width: 1, opacity: on ? .9 : .5},
         label: {formatter: 'RSI' + m.period + ' 卖 ' + m.sell_threshold,
                 color: '#10b981', fontSize: 9, position: 'insideStartBottom'}}
      ]},
      markPoint: {data: buys.concat(sells), label: {show: false}},
      z: on ? 5 : 3
    });
  });

  c.setOption({
    backgroundColor: 'transparent',
    axisPointer: {link: [{xAxisIndex: 'all'}],
                  label: {backgroundColor: '#3a3a42', fontSize: 9}},
    tooltip: {trigger: 'axis', axisPointer: {type: 'cross',
              crossStyle: {color: '#8f8f97'}}, textStyle: {fontSize: 11}},
    title: [
      {text: '价格 / 全收益（起点 = 100）', left: '7%', top: 2,
       textStyle: {color: '#8f8f97', fontSize: 11, fontWeight: 'normal'}},
      {text: 'RSI 副图（虚线 = 买/卖阈值）', left: '7%', top: 366,
       textStyle: {color: '#8f8f97', fontSize: 11, fontWeight: 'normal'}}
    ],
    legend: {data: legend, selected: selected,
             textStyle: {color: '#8f8f97', fontSize: 11}, top: 0, right: 8},
    grid: [
      {left: '7%', right: '4%', top: 44, height: 300},
      {left: '7%', right: '4%', top: 396, height: 230}
    ],
    xAxis: [0, 1].map(function (k) {
      return {type: 'category', gridIndex: k, data: dates, boundaryGap: false,
              axisLine: {lineStyle: {color: '#2a2a33'}}, axisTick: {show: false},
              axisLabel: {show: k === 1, color: '#8f8f97', fontSize: 10}};
    }),
    yAxis: [
      {gridIndex: 0, type: 'value', scale: true, name: '归一化',
       nameTextStyle: {color: '#8f8f97', fontSize: 10},
       axisLabel: {color: '#8f8f97', fontSize: 10},
       splitLine: {lineStyle: {color: '#2a2a33'}}},
      {gridIndex: 1, type: 'value', min: 0, max: 100, name: 'RSI',
       nameTextStyle: {color: '#8f8f97', fontSize: 10},
       axisLabel: {color: '#8f8f97', fontSize: 9}, splitNumber: 3,
       splitLine: {lineStyle: {color: '#2a2a33'}}}
    ],
    dataZoom: [
      {type: 'inside', xAxisIndex: [0, 1]},
      {type: 'slider', xAxisIndex: [0, 1], height: 14, bottom: 8,
       borderColor: 'rgba(139,139,144,.25)', fillerColor: 'rgba(139,139,144,.12)',
       handleSize: '80%', showDetail: false}
    ],
    series: series
  });
}

function drawVal(d) {
  const el = document.getElementById('c-val');
  if (!el) return;
  const c = echarts.init(el);
  const dates = d.dates;
  const pe = d.pe_series || [], pb = d.pb_series || [], dy = d.dyr_series || [];

  // 估值数据只有末尾 501 天，前面的 None 会让 x 轴拉得很长，故裁到有效区间
  let s = 0;
  for (let i = 0; i < pe.length; i++) { if (pe[i] != null) { s = Math.max(0, i - 5); break; } }
  const X = dates.slice(s);
  const cut = a => (a || []).slice(s);

  const panels = [
    {name: 'PE-TTM 分位', data: cut(pe), color: '#539BF5', grid: 0,
     title: 'PE-TTM 分位（%）', max: 100},
    {name: 'PB 分位', data: cut(pb), color: '#a855f7', grid: 1,
     title: 'PB 分位（%）', max: 100},
    {name: '股息率分位', data: cut(dy), color: '#f59e0b', grid: 2,
     title: '股息率分位（%）', max: 100}
  ];

  const series = panels.map(function (p, idx) {
    return {
      name: p.name, type: 'line', xAxisIndex: p.grid, yAxisIndex: p.grid,
      data: p.data, smooth: true, showSymbol: false,
      lineStyle: {color: p.color, width: 1.6},
      areaStyle: {color: p.color, opacity: .10},
      markLine: {silent: true, symbol: 'none', data: [
        {yAxis: 33, lineStyle: {color: '#10b981', type: 'dashed', width: 1},
         label: {formatter: '33 便宜', color: '#10b981', fontSize: 9,
                 position: 'insideStartTop'}},
        {yAxis: 66, lineStyle: {color: '#ef4444', type: 'dashed', width: 1},
         label: {formatter: '66 贵', color: '#ef4444', fontSize: 9,
                 position: 'insideStartBottom'}}
      ]}
    };
  });

  c.setOption({
    backgroundColor: 'transparent',
    axisPointer: {link: [{xAxisIndex: 'all'}],
                  label: {backgroundColor: '#3a3a42', fontSize: 9}},
    tooltip: {trigger: 'axis', axisPointer: {type: 'cross',
              crossStyle: {color: '#8f8f97'}}, textStyle: {fontSize: 11}},
    title: panels.map(function (p, i) {
      return {text: p.title, left: '8%', top: 4 + i * 168,
              textStyle: {color: '#8f8f97', fontSize: 11, fontWeight: 'normal'}};
    }),
    grid: [
      {left: '8%', right: '4%', top: 26, height: 122},
      {left: '8%', right: '4%', top: 194, height: 122},
      {left: '8%', right: '4%', top: 362, height: 100}
    ],
    xAxis: [0, 1, 2].map(function (k) {
      return {type: 'category', gridIndex: k, data: X, boundaryGap: false,
              axisLine: {lineStyle: {color: '#2a2a33'}}, axisTick: {show: false},
              axisLabel: {show: k === 2, color: '#8f8f97', fontSize: 10}};
    }),
    yAxis: [0, 1, 2].map(function (k) {
      return {gridIndex: k, type: 'value', min: 0, max: 100,
              axisLabel: {color: '#8f8f97', fontSize: 9}, splitNumber: 2,
              splitLine: {lineStyle: {color: '#2a2a33'}}};
    }),
    series: series
  });
}

// 直接用 location.hostname 拼 API 源，不依赖共享脚本的 API_BASE：
// api-client.js 与页面内联脚本都声明过同名常量，取到的值不可控。
const API_ORIGIN = 'http://' + window.location.hostname + ':8788';
fetch(`${API_ORIGIN}/api/market-scan/fcf-advice-detail?code=${CODE}` + (DATE ? `&date=${DATE}` : ''))
  .then(r => r.json())
  .then(d => {
    if (d.error) throw new Error(d.error);
    document.getElementById('sub').textContent =
      `${d.name}（${d.code}）· ${d.date} · 数据 2012-12-31 起 13.68 年`;
    render(d);
  })
  .catch(e => {
    document.getElementById('root').innerHTML =
      `<div class="err">加载失败：${e.message}<br><br>请确认后端已启动（python src/server.py，端口 8788）</div>`;
  });
</script>
