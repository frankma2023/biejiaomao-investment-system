<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="/manifest.json">
<title>大盘扫描</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  .top-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px}
  .top-bar label{font-size:10px;font-weight:500;color:var(--muted);display:block;margin-bottom:2px;text-transform:uppercase;letter-spacing:.03em}
  .top-bar input,.top-bar select{font-family:var(--font-body);padding:5px 10px;border:1px solid var(--border);border-radius:10px;font-size:12px;background:var(--card);color:var(--text-primary);outline:none;transition:all .2s;backdrop-filter:blur(10px)}
  .top-bar input:focus,.top-bar select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,158,11,.1)}
  .tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:2px;flex-wrap:wrap}
  .tab{padding:6px 14px;border:1px solid var(--border);border-radius:10px;background:rgba(26,26,31,.4);color:var(--muted);cursor:pointer;font-family:var(--font-body);font-size:11px;font-weight:500;transition:all .2s;white-space:nowrap}
  .tab:hover{border-color:var(--border-hover);color:#d4d4d8}
  .tab.active{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent-border)}
  .tab-content{display:none;animation:fadeIn .4s ease}
  .tab-content.active{display:block}
  .btn-glass{font-family:var(--font-body);font-size:10px;font-weight:500;padding:4px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--card);color:var(--muted);transition:all .2s;text-decoration:none;display:inline-block}
  .btn-glass:hover{color:#d4d4d8;background:rgba(255,255,255,.04);border-color:var(--border-hover)}
  .btn-accent{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent-border)}
  .btn-accent:hover{background:rgba(245,158,11,.18)}
  html[data-theme="light"] .top-bar input,html[data-theme="light"] .top-bar select{background:rgba(255,255,255,.7);border-color:var(--divider);color:var(--text-primary)}
  html[data-theme="light"] .tab{background:rgba(255,255,255,.6);border-color:var(--divider);color:var(--muted)}
  html[data-theme="light"] .tab:hover{border-color:rgba(0,0,0,.15);color:#374151}
  html[data-theme="light"] .tab.active{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent-border)}
.layout { max-width:1100px; margin:0 auto; }
    /* Hero */
    .score-hero { display:flex; gap:20px; align-items:center; padding:22px 28px; background:var(--card-bg); border-radius:20px; box-shadow:0 2px 12px rgba(0,0,0,0.06); margin-bottom:14px; }
    /* 三卡并列 */
    .score-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
    .score-card,.score-row .score-hero{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow-card);min-height:160px}
    .score-card{display:flex;flex-direction:column;gap:8px}
    .score-card .sc-title{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
    .score-card .sc-val{font-family:var(--font-display);font-size:1.6rem;font-weight:400;color:var(--text-primary);line-height:1.1}
    .score-card .sc-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}
    .score-card .sc-chart{flex:1;min-height:70px}
    .score-row .score-hero{display:flex;gap:16px;align-items:center;margin-bottom:0}
    /* 行业分组卡片（v3.0）*/
    .sector-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
    .sector-card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;min-height:130px;transition:all .2s}
    .sector-card:hover{transform:translateY(-1px);border-color:var(--border-hover)}
    .sector-card .sc-title{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
    @media(max-width:900px){.sector-grid{grid-template-columns:repeat(3,1fr)}}
    @media(max-width:500px){.sector-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.score-row{grid-template-columns:1fr}}
    /* 主要指数卡片 */
    .idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
    .idx-card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow-card);transition:all .2s}
    .idx-card:hover{border-color:var(--border-hover);transform:translateY(-1px)}
    .idx-card .idx-name{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
    .idx-card .idx-price{font-family:var(--font-display);font-size:1.1rem;font-weight:400;color:var(--text-primary)}
    .idx-card .idx-chg{font-size:11px;font-weight:500;margin-top:2px}
    .idx-card .idx-spark{width:100%;height:50px;margin-top:6px}
    .score-ring { width:90px; height:90px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .score-ring .num { font-family:var(--font-display); font-size:2rem; font-weight:900; }
    .score-info .label { font-size:0.6rem; color:var(--muted); letter-spacing:0.06em; }
    .score-info .rating { font-family:var(--font-display); font-size:1.4rem; font-weight:900; }
    .score-info .advice { font-size:0.72rem; color:var(--text-secondary); margin-top:4px; }
    .score-date { font-size:0.6rem; color:var(--muted); margin-left:auto; }
    /* Section header */
    .section-hdr { font-family:var(--font-display); font-size:0.75rem; font-weight:800; color:var(--text-secondary); margin:16px 0 10px; letter-spacing:0.04em; }
    /* Core signal cards */
    .core-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-bottom:14px; }
    .core-card { padding:18px; border-radius:16px; text-align:center; }
    .core-card .icon { font-size:1.6rem; }
    .core-card .label { font-family:var(--font-display); font-size:0.7rem; font-weight:700; margin-top:6px; }
    .core-card .val { font-family:var(--font-display); font-size:1.2rem; font-weight:900; margin-top:4px; }
    .core-card .desc { font-size:0.62rem; margin-top:8px; line-height:1.5; color:var(--text-secondary); }
    .core-danger { background:rgba(239,68,68,.1); border:1.5px solid rgba(239,68,68,.3); }
    .core-warning { background:rgba(245,158,11,.1); border:1.5px solid rgba(245,158,11,.3); }
    .core-ok { background:rgba(16,185,129,.1); border:1.5px solid rgba(16,185,129,.3); }
    .core-unknown { background:var(--card); border:1.5px solid var(--border); }
.capital-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.cap-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s}
.cap-card:hover{border-color:var(--border-hover);transform:translateY(-1px)}
.cap-card .ct{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:500}
.cap-card .cv{font-family:'Instrument Serif',serif;font-size:22px;font-weight:400;margin:4px 0 2px}
.cap-card .cs{font-size:11px;color:var(--text-secondary)}
.cap-expand{display:none;grid-column:1/-1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:-8px}
.cap-expand.active{display:block}
.cap-spark{width:100%;height:120px}
@media(max-width:700px){.capital-row{grid-template-columns:1fr}}
    /* Indicator cards */
    .ind-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px; margin-bottom:12px; }
    .ind-card { background:var(--card-bg); border-radius:16px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,0.05); display:flex; flex-direction:column; }
    .ind-card .ih { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px; }
    .ind-card .in { font-family:var(--font-display); font-size:0.76rem; font-weight:800; }
    .ind-card .it { font-size:0.52rem; color:var(--muted); background:var(--bg); padding:2px 8px; border-radius:10px; }
    .ind-card .iv { font-family:var(--font-display); font-size:1.3rem; font-weight:900; }
    .ind-card .iu { font-size:0.55rem; color:var(--muted); font-weight:400; }
    .ind-card .ibar { height:5px; background:var(--bg); border-radius:3px; margin-top:6px; overflow:hidden; }
    .ind-card .ibar-fill { height:100%; border-radius:3px; }
    .ind-card .is { font-size:0.58rem; color:var(--muted); margin-top:3px; text-align:right; }
    .ind-card .id { font-size:0.6rem; color:var(--muted); margin-top:8px; line-height:1.5; border-top:1px solid var(--divider); padding-top:8px; }
    .clickable { cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px; }
    .clickable:hover { color:var(--accent); }
    /* Panorama */
    .pano-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .pano-card { background:var(--card-bg); border-radius:16px; padding:16px; box-shadow:0 1px 6px rgba(0,0,0,0.05); }
    .pano-card h3 { font-family:var(--font-display); font-size:0.72rem; font-weight:800; margin:0 0 10px; color:var(--text-secondary); }
    .pano-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
    .pano-item { text-align:center; padding:10px 8px; background:var(--bg); border-radius:12px; }
    .pano-item .pv { font-family:var(--font-display); font-size:1.3rem; font-weight:900; }
    .pano-item .pl { font-size:0.58rem; color:var(--muted); margin-top:2px; }
    .pano-item .pd { font-size:0.55rem; color:var(--muted); margin-top:6px; line-height:1.4; }
    /* Rotation */
    .rot-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .rot-card { background:var(--card-bg); border-radius:14px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
    .rot-card h4 { font-family:var(--font-display); font-size:0.68rem; font-weight:800; margin:0 0 6px; }
    .rot-card .rm { font-family:var(--font-display); font-size:1rem; font-weight:900; }
    .rot-card .rd { font-size:0.55rem; color:var(--muted); margin-top:2px; }
    .rot-card .tl { display:flex; flex-wrap:wrap; gap:3px; margin-top:8px; }
    .rt { font-size:0.54rem; padding:2px 7px; border-radius:7px; font-weight:600; }
    .rt.tw { background:var(--accent); color:#FFF; }
    .rt.lw { background:var(--bg); color:var(--muted); }
    .rt.bo { background:var(--color-accent-subtle); color:var(--accent); }
    /* Modal */
    .modal-overlay.show { display:flex; }
    .modal-box { background:var(--card-bg); border-radius:20px; padding:24px; max-width:800px; width:90%; max-height:80vh; overflow-y:auto; box-shadow:0 8px 40px rgba(0,0,0,0.15); }
    .modal-box h2 { font-family:var(--font-display); font-size:1rem; font-weight:800; margin:0 0 4px; }
    .modal-sub { font-size:0.65rem; color:var(--muted); margin-bottom:14px; }
    .bt { width:100%; border-collapse:collapse; font-size:0.7rem; }
    .bt th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--divider); font-size:0.62rem; color:var(--muted); font-weight:700; }
    .bt td { padding:5px 8px; border-bottom:1px solid var(--divider); }
    .tu { color:#E53935; font-weight:700; } .td { color:#26C6DA; font-weight:700; }
    @media (max-width:700px) { .core-grid,.rot-grid,.pano-row { grid-template-columns:1fr; } .pano-grid { grid-template-columns:1fr 1fr; } }
    .nav-dropdown:hover .nav-dropdown-menu { display:block; }
    .no-data { text-align:center; padding:48px; color:var(--muted); font-size:0.8rem; }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<script>(function(){var c=document.getElementById("bg-canvas"),w=c.width=window.innerWidth,h=c.height=window.innerHeight;var ctx=c.getContext("2d"),N=60;var p=[];for(var i=0;i<N;i++)p.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.5+.3,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,o:Math.random()*.4+.1});function draw(){ctx.clearRect(0,0,w,h);for(var i=0;i<N;i++){var P=p[i];P.x+=P.vx;P.y+=P.vy;if(P.x<0)P.x=w;if(P.x>w)P.x=0;if(P.y<0)P.y=h;if(P.y>h)P.y=0;ctx.beginPath();ctx.arc(P.x,P.y,P.r,0,Math.PI*2);ctx.fillStyle="rgba(245,158,11,"+P.o+")";ctx.fill()}for(var i=0;i<N;i++){for(var j=i+1;j<N;j++){var dx=p[i].x-p[j].x,dy=p[i].y-p[j].y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<100){ctx.beginPath();ctx.moveTo(p[i].x,p[i].y);ctx.lineTo(p[j].x,p[j].y);ctx.strokeStyle="rgba(245,158,11,"+((100-dist)/100*.06)+")";ctx.stroke()}}}requestAnimationFrame(draw)}draw();window.addEventListener("resize",function(){w=c.width=window.innerWidth;h=c.height=window.innerHeight})})();
</script>
<div class="app-container">

  <nav id="top-nav"></nav>
    <div class="layout">
      <div id="date-bar" style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="font-family:var(--font-display);font-size:0.85rem;font-weight:800;color:var(--text-primary)">📅 大盘扫描</span>
        <input type="date" id="date-picker" style="font-family:var(--font-body);padding:5px 12px;border:1px solid var(--border);border-radius:10px;font-size:12px;background:var(--card);color:var(--text-primary);outline:none" onchange="onDateChange(this.value)">
        <span id="date-label" style="font-size:0.6rem;color:var(--muted)"></span>
        <button onclick="computeSnapshot()" style="margin-left:auto;font-size:10px;padding:4px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--muted);cursor:pointer;font-family:var(--font-body)">🔄 刷新计算</button>
      </div>
      <div id="content"></div>
    </div>
    <div class="modal-overlay" id="breakout-modal" onclick="if(event.target===this)closeBreakoutModal()">
      <div class="modal-box"><button class="modal-close" onclick="closeBreakoutModal()">✕</button><h2>🚀 放量突破个股</h2><div class="modal-sub" id="breakout-meta"></div><div id="breakout-table"></div></div>
    </div>
    <div class="modal-overlay" id="sector-modal" onclick="if(event.target===this)closeSectorModal()">
      <div class="modal-box"><button class="modal-close" onclick="closeSectorModal()">✕</button><h2 id="sector-modal-title">🏭 </h2><div class="modal-sub" id="sector-meta"></div><div id="sector-index-table"></div></div>
    </div>
    <div class="modal-overlay" id="constituent-modal" onclick="if(event.target===this)closeConstModal()">
      <div class="modal-box"><button class="modal-close" onclick="closeConstModal()">✕</button><h2 id="const-modal-title">📋 </h2><div id="const-table"></div></div>
    </div>
  </div>
  
  <script src="../shared/js/api-client.js"></script>
  <script>
    function rc(s) { if(s>=80)return'#2E7D32';if(s>=65)return'#558B2F';if(s>=50)return'#F9A825';if(s>=35)return'#FF8F00';if(s>=20)return'#E53935';return'#B71C1C'; }
    function rl(s) {
      if(s>=80)return{r:'A',l:'强势市场',a:'可积极选股，仓位70%'};if(s>=65)return{r:'B',l:'偏强市场',a:'可适度选股，仓位50%'};
      if(s>=50)return{r:'C',l:'中性市场',a:'精选个股，仓位35%'};if(s>=35)return{r:'D',l:'偏弱市场',a:'减少操作，仓位20%'};
      if(s>=20)return{r:'E',l:'弱势市场',a:'暂停选股，现金为王'};return{r:'F',l:'深度熊市',a:'全面防守，停止买入'};
    }
    const DESC={
      ma50_above:'MA50上方占比衡量市场宽度。高于70%说明多数个股处于上升趋势，是健康牛市的标志；低于30%意味着市场极度疲弱，但极端低值常预示反弹。',
      hl_ratio:'新高新低比反映创新高和创新低个股的力量对比。比值>2表明多方主导、突破力量充沛；比值<0.5则多数个股在创新低，选股风险极大。',
      ad_ratio:'涨跌家数比捕捉每日市场情绪。比值>2表示普涨格局、赚钱效应强；<0.6的普跌往往伴随恐慌。与指数背离时是指数涨而多数股跌，系机构拉权重出货的典型信号。',
      vol_breakout:'放量突破数衡量机构大资金的活动频率。数值飙升意味着大量个股同时放量突破阻力位，是机构积极建仓的证据；持续低迷则表明市场缺乏领涨品种。',
      margin_5d:'融资余额5日变化反映杠杆资金态度。持续增加说明资金看多后市并愿承担融资成本；快速下降则是去杠杆信号，往往伴随市场调整。',
      sector_rot:'板块轮动稳定性看领涨行业是否持续抱团。重叠率高表示强势板块格局稳固、资金有明确方向；快速轮动说明资金短线博弈、缺乏主线。',
      fear_greed:'恐慌贪婪指数综合波动率、宽度和动量三维度。极度恐慌(<20%)往往出现在暴跌尾声，是潜在反转前兆；极度贪婪(>80%)提示过热风险。',
    };
    function fm(v){if(v==null)return'—';if(v>=1e8)return(v/1e8).toFixed(2)+'亿';if(v>=1e4)return(v/1e4).toFixed(0)+'万';return v.toString();}

    async function load(specificDate) {
      const div=document.getElementById('content');
      try{
        var dateParam = specificDate || 'latest';
        const[hr,pr,sr,da,fcfa]=await Promise.all([
          fetch(API_BASE+'/api/market-health?date='+dateParam).then(r=>r.json()),
          fetch(API_BASE+'/api/market-panorama').then(r=>r.json()),
          fetch(API_BASE+'/api/market-sell-score?date='+dateParam).then(r=>r.json()).catch(()=>({status:'no_data'})),
          fetch(API_BASE+'/api/market-scan/dividend-advice?date='+(dateParam==='latest'?'':dateParam)).then(r=>r.json()).catch(()=>({indices:[]})),
          fetch(API_BASE+'/api/market-scan/fcf-advice?date='+(dateParam==='latest'?'':dateParam)).then(r=>r.json()).catch(()=>({}))
        ]);
        if(hr.status==='no_data'){div.innerHTML='<div class="no-data">📡 暂无健康度数据 (date='+dateParam+')</div>';return;}
        hr.dividend_advice=da;
        hr.fcf_advice=fcfa;
        render(hr,pr,sr);
        loadMajorIndices();
      }catch(e){div.innerHTML='<div class="no-data">📡 数据加载失败</div>';}
    }

    function onDateChange(newDate){
      load(newDate);
    }

    // 主要指数数据
    const MAJOR_INDICES=[
      {code:'000985',name:'中证全指'},{code:'000001',name:'上证指数'},
      {code:'399001',name:'深证成指'},{code:'399006',name:'创业板指'},
      {code:'000688',name:'科创50'},{code:'000300',name:'沪深300'}
    ];
    let idxData=[];
    async function loadMajorIndices(){
      var end=new Date().toISOString().slice(0,10);
      var start=new Date(Date.now()-30*86400000).toISOString().slice(0,10);
      var results=[];
      for(var i=0;i<MAJOR_INDICES.length;i++){
        var idx=MAJOR_INDICES[i];
        try{
          var r=await fetch(API_BASE+'/api/pattern-scan?code='+idx.code+'&start='+start+'&end='+end+'&period=daily&mode=index');
          var d=await r.json();
          results.push({code:idx.code,name:idx.name,klines:d.klines||[]});
        }catch(e){results.push({code:idx.code,name:idx.name,klines:[]})}
      }
      idxData=results;
      renderIndexCards();
      // 也渲染评分卡中的趋势图（依赖刚加载的指数数据）
      renderScoreCharts();
      return results;
    }

            grid:{left:0,right:4,top:4,bottom:4},
            xAxis:{show:false,data:kl.map(function(k){return k.date})},
            yAxis:{show:false},
            series:[{type:'bar',data:vols,itemStyle:{color:barColor,borderRadius:[2,2,0,0]},barMaxWidth:8}]

        var kl2=idx000985.klines.slice(-20);

        var el2=document.getElementById('chart-hl-trend');if(el2){
          if(el2._echart)el2._echart.dispose();
          var ch2=echarts.init(el2);el2._echart=ch2;
          var isUp=closes[closes.length-1]>=closes[0];
          var lc=isUp?'#ef4444':'#10b981';

            grid:{left:0,right:0,top:4,bottom:4},

              areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:ac},{offset:1,color:'transparent'}])}}]
          });
        }
      }
    }

window._capOpen=null;
function renderMarginChart(){
  var isDark=document.documentElement.dataset.theme==='dark';
  var tx=isDark?'#999':'#6E6E6E',sp=isDark?'rgba(200,200,200,0.08)':'rgba(128,128,128,0.1)';
  var tr=window._marginTrend||[];
  if(tr.length<2)return;
  
  // Chart 1: 余额趋势线
  var el0=document.getElementById('cap-chart-0');if(!el0||el0._rendered)return;el0._rendered=true;
  var c0=echarts.init(el0);
  c0.setOption({
    backgroundColor:'transparent',tooltip:{trigger:'axis'},
    grid:{left:'8%',right:'4%',top:12,bottom:36},
    xAxis:{type:'category',data:tr.map(function(x){return x.date}),axisLabel:{color:tx,fontSize:9,rotate:45},axisLine:{lineStyle:{color:sp}}},
    yAxis:{type:'value',min:9000,axisLabel:{color:tx,fontSize:9,formatter:function(v){return v.toFixed(0)+'亿'}},splitLine:{lineStyle:{color:sp}}},
    dataZoom:[{type:'inside',start:0,end:100}],
    series:[{type:'line',data:tr.map(function(x){return x.balance}),smooth:true,lineStyle:{color:'#f59e0b',width:2},areaStyle:{color:isDark?'rgba(245,158,11,.1)':'rgba(245,158,11,.06)'},showSymbol:false}]
  });
  
  // Chart 2: 融资净买入柱状图
  var el1=document.getElementById('cap-chart-1');if(!el1)return;
  var c1=echarts.init(el1);
  var nbData=tr.map(function(x){return x.net_buy});
  c1.setOption({
    backgroundColor:'transparent',tooltip:{trigger:'axis',formatter:function(p){return p[0].name+'<br/>净买入: '+p[0].value.toFixed(0)+'亿'}},
    grid:{left:'8%',right:'4%',top:8,bottom:24},
    xAxis:{type:'category',data:tr.map(function(x){return x.date}),axisLabel:{color:tx,fontSize:8,rotate:45},axisLine:{lineStyle:{color:sp}}},
    yAxis:{type:'value',axisLabel:{color:tx,fontSize:9,formatter:function(v){return v.toFixed(0)+'亿'}},splitLine:{lineStyle:{color:sp}}},
    dataZoom:[{type:'inside',start:0,end:100}],
    series:[{type:'bar',data:nbData,itemStyle:{color:function(p){return p.value>=0?'#ef4444':'#10b981'},borderRadius:[4,4,0,0]},barWidth:'50%'}]
  });
}
function toggleCap(idx){
  if(window._capOpen!==null&&window._capOpen!==idx){
    document.getElementById('cap-expand-'+window._capOpen).classList.remove('active');
  }
  var el=document.getElementById('cap-expand-'+idx);
  if(window._capOpen===idx){el.classList.remove('active');window._capOpen=null;return;}
  el.classList.add('active');window._capOpen=idx;
  if(idx===0)setTimeout(renderMarginChart,50);
}
