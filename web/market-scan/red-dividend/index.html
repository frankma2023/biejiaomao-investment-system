<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>指数投资 · 总览</title>
<link rel="stylesheet" href="/shared/css/hanako-glass.css">
<script src="/shared/js/api-client.js"></script>
<script src="/shared/js/echarts.min.js"></script>
<style>
body{background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:13px;margin:0;padding:24px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-family:var(--font-display);font-size:1.3rem;font-weight:400;color:var(--accent);margin:0 0 4px}
.sub{font-size:0.68rem;color:var(--muted);margin-bottom:20px}
.section-hdr{font-family:var(--font-display);font-size:0.75rem;font-weight:700;color:var(--text-secondary);margin:18px 0 8px;letter-spacing:0.05em}
.sector-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.sector-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;min-height:130px}
.sector-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sc-title{font-family:var(--font-display);font-size:0.78rem;font-weight:700}
.sc-title .code{font-size:0.62rem;color:var(--muted);font-family:var(--font-mono);font-weight:400}
.lv{font-size:0.95rem;font-weight:700}
.tx{font-size:0.7rem;color:var(--text-secondary);margin-top:2px}
.meta{font-size:0.66rem;color:var(--muted);margin-top:6px}
.sig{font-size:0.64rem;color:var(--muted);margin-top:4px;border-top:1px solid var(--border);padding-top:6px}
.note{font-size:0.62rem;color:#f59e0b;margin-top:14px;line-height:1.7}
.toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.toolbar a{font-size:0.68rem;color:var(--accent);text-decoration:none;border:1px solid var(--border);border-radius:8px;padding:6px 12px}
.toolbar a:hover{background:var(--accent-subtle)}
</style>
</head>
<body>
<nav id="top-nav"></nav>
<div class="wrap">
  <h1>🧭 指数投资</h1>
  <div class="sub" id="meta">红利/自由现金流/中证煤炭指数操作建议 · 回撤买点 + 估值分位 + 网格 · 点击卡片查看详情</div>
  <div class="toolbar">
    <a href="lab.html">🔬 回撤实验室</a>
    <a href="../dividend-advice-detail.html?code=000922">📈 中证红利详情</a>
    <a href="../fcf-advice-detail.html">🧲 自由现金流详情</a>
    <a href="../coal-advice-detail.html">⛏ 中证煤炭详情</a>
  </div>
  <div id="content">加载中...</div>
</div>

<script>
// B1 修复：图表所需主题变量（echarts 图用，与 lab.html 同构）
(function(){var s=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=s})();
const isDark = document.documentElement.dataset.theme === 'dark';
const tx = isDark ? '#999' : '#6E6E6E';
const sp = isDark ? 'rgba(200,200,200,0.08)' : 'rgba(128,128,128,0.1)';
const chartBg = isDark ? 'rgba(26,26,31,.6)' : 'rgba(255,255,255,.75)';

const LV = {
  strong_buy:['强买入','#ef4444',{bg:'rgba(239,68,68,.08)',bd:'rgba(239,68,68,.25)'}],
  buy:['买入','#ef4444',{bg:'rgba(239,68,68,.06)',bd:'rgba(239,68,68,.2)'}],
  strong_reduce:['强减仓','#059669',{bg:'rgba(5,150,105,.1)',bd:'rgba(5,150,105,.3)'}],
  reduce:['减仓','#10b981',{bg:'rgba(16,185,129,.08)',bd:'rgba(16,185,129,.25)'}],
  caution:['谨慎','#f59e0b',{bg:'rgba(245,158,11,.08)',bd:'rgba(245,158,11,.25)'}],
  hold:['观望','#8b8b90',{bg:'rgba(139,139,144,.06)',bd:'rgba(139,139,144,.2)'}]
};

async function load() {
  try {
    const [da, fa, ca, hk, fr] = await Promise.all([
      fetch(API_BASE + '/api/market-scan/dividend-advice').then(r => r.json()).catch(() => ({indices:[]})),
      fetch(API_BASE + '/api/market-scan/fcf-advice').then(r => r.json()).catch(() => ({})),
      fetch(API_BASE + '/api/market-scan/coal-advice').then(r => r.json()).catch(() => ({error:'no data'})),
      fetch(API_BASE + '/api/market-scan/hk-etf').then(r => r.json()).catch(() => ({etfs:[]})),
      fetch(API_BASE + '/api/market-scan/full-return-compare').then(r => r.json()).catch(() => ({series:[]}))
    ]);
    const date = da.date || fa.date || ca.date || '';
    document.getElementById('meta').textContent = '红利/自由现金流/中证煤炭指数操作建议 · ' + date + ' · 点击卡片查看详情';

    let html = '';
    // 📋 决策框架（回测验证 2018-2026，H00922 全收益口径）
    html += '<div class="section-hdr">📋 红利决策框架（怎么买怎么卖）</div>';
    html += '<div class="card" style="font-size:0.68rem;color:var(--text-secondary);line-height:2">';
    html += '<div style="font-weight:600;color:#ef4444">🟢 买点（主信号）：250日回撤 ≥10% → 分批买入 <span style="font-weight:400;color:var(--muted)">（74%胜率 · 32次验证 · 全收益口径）</span></div>';
    html += '<div style="padding-left:16px;color:var(--muted)">加码条件：息差 ≥3%（60日74%）或 温度计 ≤30 冷区（60日64%）→ 买得更重</div>';
    html += '<div style="font-weight:600;color:#10b981;margin-top:4px">🔴 卖点（三个预警，出现即减仓）<span style="font-weight:400;color:var(--muted)">：PE分位&gt;80% ｜ 20日涨幅&gt;10% ｜ 60日涨幅&gt;15%（下跌概率80%，样本6-10次偏小）</span></div>';
    html += '<div style="font-weight:600;color:#f59e0b;margin-top:4px">🟡 辅助尺度（各管各的时间尺度）</div>';
    html += '<div style="padding-left:16px;color:var(--muted)">估值分位 = 定投加权（短线择时无效）｜ 温度计 ≥65 热区 = 回避/减仓（60日43%）｜ 拥挤度 = 状态监控</div>';
    html += '<div style="color:var(--muted);margin-top:4px">⚠️ 无效信号：PB分位择时（53%≈随机）、息差 &lt;2.5% 买入（51%≈随机）、估值分位短线择时——别用</div>';
    html += '</div>';
    html += '<div class="card"><div class="ct">📈 红利标的全收益对比（起点=100 · 含分红再投）</div><div id="chart-fr" style="height:360px"></div><div style="font-size:0.6rem;color:var(--muted);margin-top:4px" id="fr-note"></div></div>';
    // 红利指数
    html += '<div class="section-hdr">📌 红利指数（回撤+估值规则）</div><div class="sector-grid">';
    (da.indices || []).forEach(x => {
      const lv = LV[x.advice_level] || LV.hold;
      const peV = x.valuation && x.valuation.pe_pct != null ? x.valuation.pe_pct + '%' : '—';
      const dyV = x.valuation && x.valuation.dyr_pct != null ? x.valuation.dyr_pct + '%' : '—';
      html += '<div class="sector-card" style="background:' + lv[2].bg + ';border-color:' + lv[2].bd + '" onclick="window.open(\'../dividend-advice-detail.html?code=' + x.code + '&date=' + date + '\')">';
      html += '<div class="sc-title">' + x.name + ' <span class="code">' + x.code + '</span></div>';
      html += '<div style="margin-top:6px"><span class="lv" style="color:' + lv[1] + '">' + lv[0] + '</span></div>';
      html += '<div class="tx">' + x.advice + '</div>';
      html += '<div class="meta">回撤 ' + x.dd_250 + '%' + (x.dd_source === 'full_return' ? '（全收益）' : '') + ' · PE分位 ' + peV + ' · 股息率分位 ' + dyV + '</div>';
      html += '<div class="sig">信号: ' + (x.signals && x.signals.length ? x.signals.join(' · ') : '—') + '</div>';
      html += '</div>';
    });
    html += '</div>';

    // 自由现金流（多指数：980092 + 932365）
    const fcfList = (fa && fa.indices && fa.indices.length) ? fa.indices : (fa && fa.code ? [fa] : []);
    if (fcfList.length) {
      html += '<div class="section-hdr">🧲 自由现金流（估值分位规则）</div><div class="sector-grid">';
      fcfList.forEach(fx => {
        const lv = LV[fx.advice_level] || LV.hold;
        const peV = fx.valuation && fx.valuation.pe_pct != null ? fx.valuation.pe_pct + '%' : '—';
        const pbV = fx.valuation && fx.valuation.pb_pct != null ? fx.valuation.pb_pct + '%' : '—';
        const dyV = fx.valuation && fx.valuation.dyr_pct != null ? fx.valuation.dyr_pct + '%' : '—';
        html += '<div class="sector-card" style="background:' + lv[2].bg + ';border-color:' + lv[2].bd + '" onclick="window.open(\'../fcf-advice-detail.html?code=' + fx.code + '&date=' + date + '\')">';
        html += '<div class="sc-title">' + fx.name + ' <span class="code">' + fx.code + '</span></div>';
        html += '<div style="margin-top:6px"><span class="lv" style="color:' + lv[1] + '">' + lv[0] + '</span></div>';
        html += '<div class="tx">' + fx.advice + '</div>';
        html += '<div class="meta">回撤 ' + fx.dd_250 + '% · PE分位 ' + peV + ' · PB分位 ' + pbV + ' · 股息率分位 ' + dyV + '</div>';
        html += '<div class="sig">信号: ' + (fx.signals && fx.signals.length ? fx.signals.join(' · ') : '—') + '</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="note">⚠️ ' + (fcfList[0].data_note || '自由现金流估值分位基于 2024-09 以来数据（约2年），短窗口统计仅供参考。') + '</div>';
    }

    // 自由现金流决策框架（回测 2012-2026 价格 + 2024-09 起估值短窗口）
    if (fcfList.length) {
      html += '<div class="section-hdr">📋 自由现金流决策框架（怎么买怎么卖）</div>';
      html += '<div class="card" style="font-size:0.68rem;color:var(--text-secondary);line-height:2">';
      html += '<div style="font-weight:600;color:#ef4444">🟢 买点：深回撤 ≥20% → 分批买入 <span style="font-weight:400;color:var(--muted)">（60日67% · 27次 · 趋势指数深回调才是上车点）</span></div>';
      html += '<div style="padding-left:16px;color:var(--muted)">增强：估值双低 PE+PB分位&lt;33%（60日100%，短窗口观察级）｜ 长期最优 = 定投/持有（年化13%）</div>';
      html += '<div style="font-weight:600;color:#10b981">🔴 卖点：20日涨幅&gt;10% → 减仓 <span style="font-weight:400;color:var(--muted)">（未来60日仅30%胜率/-3.0%）</span> ｜ 60日涨幅&gt;15% → 减仓（44%/-4.3%）</div>';
      html += '<div style="color:var(--muted)">⚠️ 浅回撤 ≥10% 无效（59% &lt; 随机67% = 接飞刀，与红利相反）；股息率分位择时不可用（短窗口噪声）</div>';
      html += '</div>';
    }

    // 中证煤炭（网格规则）
    if (ca && !ca.error) {
      const clv = LV[ca.advice_level] || LV.hold;
      const g = ca.grid || {};
      html += '<div class="section-hdr">⛏ 中证煤炭（网格规则）</div><div class="sector-grid">';
      html += '<div class="sector-card" style="background:' + clv[2].bg + ';border-color:' + clv[2].bd + '" onclick="window.open(\'../coal-advice-detail.html?date=' + ca.date + '\')">';
      html += '<div class="sc-title">' + ca.name + ' <span class="code">' + ca.code + '</span></div>';
      html += '<div style="margin-top:6px"><span class="lv" style="color:' + clv[1] + '">' + clv[0] + '</span></div>';
      html += '<div class="tx">' + ca.advice + '</div>';
      html += '<div class="meta">第' + (g.level != null ? g.level : '—') + '档 ' + (g.grid_low != null ? g.grid_low + '~' + g.grid_high : '—') + ' · 250日位置 ' + ca.pos_250 + '% · 回撤 ' + ca.dd_250 + '%</div>';
      html += '<div class="sig">2018起网格 +' + (g.ret_2018 != null ? g.ret_2018 + '%' : '—') + ' vs 持有 +' + (g.hold_2018 != null ? g.hold_2018 + '%' : '—') + ' · 间距 ' + g.step_pct + '%</div>';
      html += '</div>';
      html += '</div>';
      html += '<div class="note">⚠️ ' + (ca.data_note || '网格回测未计滑点/手续费') + '</div>';
    }

    // 港股红利ETF（观察）
    if (hk && hk.etfs && hk.etfs.length) {
      html += '<div class="section-hdr">🇭🇰 港股红利ETF（观察）</div>';
      html += '<div class="card" style="font-size:0.68rem;color:var(--text-secondary);line-height:2">';
      html += '<div style="font-weight:600;color:#ef4444">🟢 买点（回测 2018 起，指数口径）</div>';
      html += '<div style="padding-left:16px;color:var(--muted)">513820 港股通高股息：<b style="color:#ef4444">深回撤 ≥15%</b> → 分批买入（60日72%）｜ 息差≥4% 辅助</div>';
      html += '<div style="padding-left:16px;color:var(--muted)">159691 高股息精选：<b style="color:#ef4444">深回撤 ≥20%</b>（67%/+7.3%）或 <b>股息率 ≥6%</b>（60%）或 <b>息差 ≥4%</b>（69%）</div>';
      html += '<div style="color:var(--muted)">❌ 无效：PE/PB 估值分位（48%≈随机甚至反向——港股盈利波动大，低分位常是盈利高点假象）；浅回撤≥10% 无效（接飞刀，与趋势指数同规律）</div>';
      html += '<div style="color:var(--muted)">⏳ 513630/159545：数据窗口短（2023-2024 起），暂无可靠结论，继续观察</div>';
      html += '</div>';
      html += '<div class="sector-grid">';
      hk.etfs.forEach(x => {
        const chgCls = x.chg >= 0 ? '#ef4444' : '#10b981';
        html += '<div class="sector-card" style="background:var(--card);border-color:var(--border)">';
        html += '<div class="sc-title">' + x.name + ' <span class="code">' + x.code + '</span></div>';
        html += '<div style="display:flex;align-items:baseline;gap:8px;margin:4px 0">';
        html += '<span style="font-family:var(--font-display);font-size:1.5rem;font-weight:400;color:var(--text-primary)">' + x.close + '</span>';
        html += '<span style="font-size:12px;font-weight:600;color:' + chgCls + '">' + (x.chg > 0 ? '+' : '') + x.chg + '%</span>';
        html += '</div>';
        html += '<div class="meta">成立来年化 ' + (x.ann > 0 ? '+' : '') + x.ann + '%（价格口径）· 费率 ' + x.fee + '%</div>';
        html += '<div class="sig">' + x.index_name + ' · ' + x.mgr + '</div>';
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="note">⚠️ 港股红利：收益为价格口径未计分红（实际全收益更高）；港股通分红需扣红利税（H股10%/红筹20%）+ 汇率风险；数据源 akshare（新浪/东财），daily_update 步骤 5.7 日更；ETF 分红为复权差异反推的估算值（含送转年份可能偏差）。</div>';
    }

    html += '<div class="note">📊 口径说明：① 回撤：中证红利（000922）用全收益 H00922（含分红再投资，2018起），其余红利指数暂用价格口径；买点规则 250日回撤≥10%（回测32次触发/20日胜率75%）。② 估值分位：PE/PB/股息率分位为<b>10年滚动口径</b>（理杏仁 y10.cvpos），非全历史——红利 PE 分位极少>85%、PB 分位极少>55%、股息率分位从未<20%，属数据特性非异常。③ 网格：中证煤炭用 8% 间距（回测最优），回撤实验室同页可用。</div>';
    document.getElementById('content').innerHTML = html;
    renderFR(fr);
  } catch(e) {
    document.getElementById('content').innerHTML = '加载失败: ' + e.message;
  }
}
load();

// 全收益对比图
let frChart = null;
function renderFR(fr) {
  const el = document.getElementById('chart-fr');
  if (!el || !fr || !fr.series || !fr.series.length) return;
  if (frChart) frChart.dispose();
  frChart = echarts.init(el);
  const colors = ['#ef4444', '#8b8b90', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
  // B3 修复：time 轴 + [date, value] 对，不同起点序列自动对齐（category 轴按索引会错位）
  const series = fr.series.map((s, i) => ({
    name: s.name, type: 'line',
    data: s.dates.map((d, j) => [d, s.values[j]]),
    smooth: true, showSymbol: false,
    lineStyle: {width: s.type === 'index' ? 1.2 : 1.8, color: colors[i % colors.length], type: s.code === '000922' ? 'dashed' : 'solid'},
    itemStyle: {color: colors[i % colors.length]},
    emphasis: {focus: 'series'}
  }));
  frChart.setOption({
    backgroundColor: chartBg, tooltip: {trigger: 'axis', valueFormatter: v => v + ''},
    legend: {type: 'scroll', bottom: 16, height: 22, textStyle: {color: tx, fontSize: 9}},
    grid: {left: '6%', right: '4%', top: 12, bottom: 92},
    xAxis: {type: 'time', axisLabel: {color: tx, fontSize: 9}, axisLine: {lineStyle: {color: sp}}},
    yAxis: {type: 'value', axisLabel: {color: tx, fontSize: 9}, splitLine: {lineStyle: {color: sp}}},
    dataZoom: [{type: 'inside'}, {type: 'slider', height: 10, bottom: 56,
      dataBackground: {lineStyle: {opacity: 0}, areaStyle: {opacity: 0}},
      selectedDataBackground: {lineStyle: {opacity: 0}, areaStyle: {opacity: 0}},
      borderColor: 'rgba(139,139,144,.25)', fillerColor: 'rgba(139,139,144,.12)',
      handleSize: '80%', showDetail: false}],
    series: series
  });
  document.getElementById('fr-note').textContent = fr.note || '';
}

function toggleTheme(){var h=document.documentElement,n=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=n;localStorage.setItem('theme',n);location.reload()}
</script>
