<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>网格模拟器 · 指数投资</title>
<link rel="stylesheet" href="/shared/css/hanako-glass.css">
<script src="/shared/js/api-client.js"></script>
<style>
body{background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:13px;margin:0;padding:24px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-family:var(--font-display);font-size:1.3rem;font-weight:400;color:var(--accent);margin:0 0 4px}
.sub{font-size:0.68rem;color:var(--muted);margin-bottom:20px}
.back{font-size:0.68rem;color:var(--muted);cursor:pointer;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--accent)}
.ctrl{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:14px}
.ctrl label{font-size:0.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}
.ctrl input,.ctrl select{margin-top:5px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);padding:5px 8px;font-family:var(--font-mono);font-size:0.8rem;width:110px}
.ctrl .hint{font-size:0.62rem;color:var(--muted);flex:1;min-width:200px;line-height:1.7}
.btn{padding:7px 18px;border:1px solid var(--accent-border);background:var(--accent-subtle);color:var(--accent);border-radius:9px;cursor:pointer;font-family:var(--font-display);font-size:0.75rem;font-weight:600;transition:all .2s}
.btn:hover{filter:brightness(1.15)}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;flex:1;min-width:120px;text-align:center}
.stat-box .n{font-family:var(--font-display);font-size:1.15rem;font-weight:600}
.stat-box .l{font-size:0.58rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.card .ct{font-size:0.75rem;font-weight:600;color:var(--accent);margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:0.7rem}
th{padding:6px 8px;border-bottom:2px solid var(--border);font-weight:600;color:var(--muted);font-size:0.56rem;text-transform:uppercase;text-align:right;background:var(--bg);border-radius:4px}
th:first-child,td:first-child{text-align:left}
td{padding:5px 8px;border-bottom:1px solid var(--border);text-align:right;font-family:var(--font-mono)}
td:first-child{font-family:var(--font-body)}
.buy{color:#ef4444;font-weight:600}
.sell{color:#10b981;font-weight:600}
.warn{color:#f59e0b;font-weight:600}
.muted{color:var(--muted)}
.cur-row{background:var(--accent-subtle)}
.banner{font-size:0.66rem;color:#f59e0b;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);border-radius:10px;padding:10px 14px;margin-bottom:14px;line-height:1.7}
.sim-input{margin-top:5px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);padding:5px 8px;font-family:var(--font-mono);font-size:0.8rem;width:110px}
</style>
</head>
<body>
<nav id="top-nav"></nav>
<div class="wrap">
  <a class="back" href="./">← 返回指数投资</a>
  <h1>🕸 网格模拟器</h1>
  <div class="sub">对称网格：跌一档买一笔、涨一档卖一笔 · 以 ETF 实时价格执行 · 触发信号可对照指数点位</div>

  <div class="ctrl">
    <div><label>指数代码</label><br><input id="p-code" type="text" value="399998" style="width:80px"></div>
    <button class="btn" onclick="fetchAdvice()">📡 回测推荐</button>
    <div class="hint">输入指数代码（如 399998 中证煤炭 / 000015 红利指数 / 931238 黄金股票），按历史数据自动扫描间距并推荐网格参数。ETF 代码数据不可靠，请用对应指数。</div>
  </div>

  <div id="advice-out"></div>

  <div class="ctrl">
    <div><label>当前价</label><br><input id="p-cur" type="number" step="0.01" value="2381"></div>
    <div><label>箱体下沿</label><br><input id="p-base" type="number" step="0.01" value="1826"></div>
    <div><label>箱体上沿</label><br><input id="p-top" type="number" step="0.01" value="2773"></div>
    <div><label>间距 %</label><br><input id="p-step" type="number" step="0.5" value="8"></div>
    <div><label>总资金</label><br><input id="p-cash" type="number" step="1000" value="60000"></div>
    <div><label>底仓 %</label><br><input id="p-base-ratio" type="number" step="5" value="33"></div>
    <div><label>每档 %</label><br><input id="p-per-ratio" type="number" step="1" value="10"></div>
    <div><label>ETF现价(选填)</label><br><input id="p-etf" type="number" step="0.01" value="" placeholder="填了显示ETF档位"></div>
    <button class="btn" onclick="calc()">生成档位表</button>
    <div class="hint">默认=中证煤炭(399998)回测推荐值。若交易 ETF，填 ETF 现价后档位表增加 ETF 触发价列（按比例换算）。</div>
  </div>

  <div id="banner"></div>
  <div id="stats-row"></div>
  <div id="tables"></div>
  <div id="sim"></div>
</div>

<script>
const $ = id => document.getElementById(id);

function fmt(x, d) { return x.toFixed(d === undefined ? 2 : d); }

async function fetchAdvice() {
  const code = $('p-code').value.trim();
  $('advice-out').innerHTML = '<div class="card">⏳ 回测中...</div>';
  try {
    const r = await fetch(API_BASE + '/api/market-scan/grid-advice?code=' + code).then(r => r.json());
    if (r.error) {
      $('advice-out').innerHTML = '<div class="card"><div class="ct">❌ ' + r.error + '</div></div>';
      return;
    }
    const fitCls = r.fit === 'good' ? 'buy' : (r.fit === 'bad' ? 'warn' : '');
    const rg = r.range, sg = r.suggest;
    let html = '<div class="card"><div class="ct">📡 ' + r.name + ' (' + r.code + ') · 回测推荐</div>';
    html += '<div style="font-size:0.68rem;color:var(--text-secondary);line-height:1.9">';
    html += '窗口 ' + r.window + ' · 现价 <b>' + r.cur + '</b> · 250日区间 ' + rg.lo250 + '~' + rg.hi250 + '（位置 ' + rg.pos_250 + '%） · 近3年高 ' + rg.hi3y + '<br>';
    html += '适配性：<b class="' + fitCls + '">' + (r.fit === 'good' ? '✅ 适合网格' : r.fit === 'neutral' ? '⚠️ 中性' : '❌ 不适合') + '</b> ' + r.fit_note + '<br>';
    html += '推荐：<b>间距 ' + sg.step + '%</b> · 下沿基准 ' + sg.base + ' · 上沿警戒 ' + sg.top + ' · 超额 ' + (sg.excess > 0 ? '+' : '') + sg.excess + 'pp（' + sg.trades + '次交易）</div>';
    html += '<table style="margin-top:10px"><tr><th>间距</th><th>网格收益</th><th>持有收益</th><th>超额</th><th>交易次数</th></tr>';
    r.scan.forEach(s => {
      html += '<tr><td>' + s.step + '%' + (s.step === sg.step ? ' <span class="warn">←推荐</span>' : '') + '</td><td>' + (s.grid_ret > 0 ? '+' : '') + s.grid_ret + '%</td><td>' + (s.hold_ret > 0 ? '+' : '') + s.hold_ret + '%</td><td class="' + (s.excess >= 0 ? 'buy' : 'sell') + '">' + (s.excess > 0 ? '+' : '') + s.excess + 'pp</td><td>' + s.trades + '</td></tr>';
    });
    html += '</table>';
    if (r.annual && r.annual.length) {
      html += '<table style="margin-top:10px"><tr><th>年份</th><th>指数涨跌</th><th>网格收益</th><th>超额</th></tr>';
      r.annual.forEach(a => {
        html += '<tr><td>' + a.year + '</td><td class="' + (a.idx_ret >= 0 ? 'buy' : 'sell') + '">' + (a.idx_ret > 0 ? '+' : '') + a.idx_ret + '%</td><td>' + (a.grid_ret > 0 ? '+' : '') + a.grid_ret + '%</td><td class="' + (a.excess >= 0 ? 'buy' : 'sell') + '">' + (a.excess > 0 ? '+' : '') + a.excess + 'pp</td></tr>';
      });
      html += '</table>';
    }
    html += '<div style="font-size:0.6rem;color:var(--muted);margin-top:8px">⚠️ ' + r.data_note + '</div>';
    html += '<div style="margin-top:12px"><button class="btn" onclick="applyAdvice(' + r.cur + ',' + sg.base + ',' + sg.top + ',' + sg.step + ')">✅ 采用推荐参数</button></div></div>';
    $('advice-out').innerHTML = html;
  } catch (e) {
    $('advice-out').innerHTML = '<div class="card">请求失败: ' + e.message + '</div>';
  }
}

function applyAdvice(cur, base, top, step) {
  $('p-cur').value = cur;
  $('p-base').value = base;
  $('p-top').value = top;
  $('p-step').value = step;
  calc();
  window.scrollTo({top: document.getElementById('tables').offsetTop - 20, behavior: 'smooth'});
}

function calc() {
  const cur = parseFloat($('p-cur').value);
  const base = parseFloat($('p-base').value);
  const top = parseFloat($('p-top').value);
  const stepPct = parseFloat($('p-step').value) / 100;
  const cashTotal = parseFloat($('p-cash').value);
  const baseRatio = parseFloat($('p-base-ratio').value) / 100;
  const perRatio = parseFloat($('p-per-ratio').value) / 100;
  const etfCur = parseFloat($('p-etf').value);
  const k = (etfCur > 0 && cur > 0) ? etfCur / cur : null;  // 指数→ETF 换算系数
  if (!(cur > 0 && base > 0 && base < cur && cashTotal > 0)) {
    $('tables').innerHTML = '<div class="card">参数不合法：下沿必须 &lt; 当前价</div>';
    return;
  }
  const step = base * stepPct;
  const per = cashTotal * perRatio;          // 每档金额
  const baseAmt = cashTotal * baseRatio;     // 底仓金额
  const lvl = Math.floor((cur - base) / step);  // 当前所在档

  // ── 状态条 ──
  const curLow = base + lvl * step;
  const curHigh = curLow + step;
  const pos = (cur - base) / (top - base) * 100;
  let state = '';
  if (cur >= top) state = '<span class="warn">已突破上沿 ' + fmt(top) + ' —— 按纪律停止卖出，让仓位跟随趋势（此价位不应新开网格）</span>';
  else if (pos > 66) state = '<span class="warn">高位区（' + fmt(pos, 0) + '%）：接近上沿，开网格不划算，等回落</span>';
  else if (pos < 33) state = '<span class="buy">低位区（' + fmt(pos, 0) + '%）：适合开网格</span>';
  else state = '<span>中位区（' + fmt(pos, 0) + '%）</span>';
  $('banner').innerHTML = '<div class="banner">📌 当前 ' + fmt(cur) + ' 位于档 ' + lvl + '（' + fmt(curLow) + ' ~ ' + fmt(curHigh) + '），箱体位置 ' + fmt(pos, 0) + '%。' + state + '<br>下一买入档：' + fmt(curLow) + '（距现价 ' + fmt((cur - curLow) / cur * 100, 1) + '%）。跌破下沿 ' + fmt(base) + ' 停止买入；突破上沿 ' + fmt(top) + ' 停止卖出。</div>';

  // ── 买入档表（当前档往下 5 档）──
  const buys = [];
  for (let l = lvl; l >= Math.max(0, lvl - 5); l--) {
    const price = base + l * step;
    const amt = (l === lvl) ? baseAmt : per;
    const shares = amt / price;
    const nextUp = price + step;  // 涨回上一档
    const profit = amt * (nextUp / price - 1);
    buys.push({l, price, amt, shares, profit, isBase: l === lvl});
  }
  let html = '<div class="card"><div class="ct">🛒 买入档（下跌触发 · 从空仓开始）</div><table><tr><th>档位</th><th>触发价' + (k ? '</th><th>ETF价' : '') + '</th><th>距现价</th><th>动作</th><th>买入金额</th><th>份额</th><th>累计投入</th><th>若涨回上一档</th></tr>';
  let cum = 0;
  buys.forEach(b => {
    cum += b.amt;
    const dist = (cur - b.price) / cur * 100;
    html += '<tr' + (b.isBase ? ' class="cur-row"' : '') + '><td>档' + b.l + (b.isBase ? ' ⭐底仓' : '') + '</td><td class="buy">' + fmt(b.price) + '</td>' + (k ? '<td class="muted">' + fmt(b.price * k) + '</td>' : '') + '<td>' + (dist >= 0 ? '-' : '+') + fmt(Math.abs(dist), 1) + '%</td><td class="buy">买入</td><td>' + fmt(b.amt, 0) + '</td><td>' + fmt(b.shares, 0) + '</td><td>' + fmt(cum, 0) + '</td><td class="sell">+' + fmt(b.profit, 0) + '</td></tr>';
  });
  html += '</table><div style="font-size:0.6rem;color:var(--muted);margin-top:6px">⭐ 底仓档 = 第一买入档；其后每档金额 = 总资金 × ' + fmt(perRatio * 100, 0) + '% = ' + fmt(per, 0) + ' 元。最后一列：该档买入后涨回上一档卖出可实现的利润。</div></div>';

  // ── 卖出档表（当前档往上 5 档）──
  const sells = [];
  for (let l = lvl + 1; l <= lvl + 5; l++) {
    const price = base + l * step;
    const down = l - 1;  // 对应买入档
    sells.push({l, price, down});
  }
  html += '<div class="card"><div class="ct">🛒 卖出档（上涨触发 · 每涨一档卖一档金额）</div><table><tr><th>档位</th><th>触发价' + (k ? '</th><th>ETF价' : '') + '</th><th>距现价</th><th>动作</th><th>卖出金额</th><th>对应买入档</th><th>该笔盈利</th></tr>';
  sells.forEach(s => {
    const dist = (s.price - cur) / cur * 100;
    const bAmt = (s.down === lvl) ? baseAmt : per;
    const profit = bAmt * (s.price / (base + s.down * step) - 1);
    html += '<tr><td>档' + s.l + '</td><td class="sell">' + fmt(s.price) + '</td>' + (k ? '<td class="muted">' + fmt(s.price * k) + '</td>' : '') + '<td>+' + fmt(dist, 1) + '%</td><td class="sell">卖出</td><td>' + fmt(Math.min(per, (baseAmt + per * Math.max(0, s.down - lvl + 1))), 0) + '</td><td>档' + s.down + (s.down === lvl ? '（底仓）' : '') + '</td><td class="buy">+' + fmt(profit, 0) + '</td></tr>';
  });
  html += '</table><div style="font-size:0.6rem;color:var(--muted);margin-top:6px">卖出金额 = 每档金额（' + fmt(per, 0) + ' 元）；底仓在上涨中逐步卖出（这是网格趋势踏空的来源，属设计属性）。突破上沿 ' + fmt(top) + ' 后停止卖出。</div></div>';
  $('tables').innerHTML = html;

  // ── 模拟器 ──
  $('sim').innerHTML =
    '<div class="card"><div class="ct">🎯 价格模拟（从当前价直线走到目标价，依次触发各档）</div>' +
    '<div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">' +
    '<div><label style="font-size:0.6rem;color:var(--muted)">目标价</label><br><input id="sim-p" class="sim-input" type="number" step="0.01" value="' + fmt(Math.max(1.12, cur * 0.88)) + '"></div>' +
    '<button class="btn" onclick="simulate(' + cur + ',' + base + ',' + step + ',' + cashTotal + ',' + baseAmt + ',' + per + ',' + lvl + ')">模拟</button>' +
    '<div style="font-size:0.62rem;color:var(--muted)">例：1.10 = 触发底仓档(1.20) + 档2(1.12)；1.35 = 空仓上涨，无操作（网格从底部档才开始买入）</div></div>' +
    '<div id="sim-out" style="margin-top:12px"></div></div>';
}

function simulate(target, cur, base, step, cashTotal, baseAmt, per, lvl) {
  const out = [];
  let cash = cashTotal, shares = 0, realized = 0, invested = 0;
  const path = [];
  if (target < cur) {
    // 下跌：从当前档往下触发买入
    for (let l = lvl; l > Math.floor((target - base) / step); l--) {
      const price = base + l * step;
      const amt = (l === lvl) ? baseAmt : per;
      path.push({t: '买', price, amt});
    }
  } else if (target > cur) {
    path.push({t: '卖', price: target, amt: per});  // 仅示意
  }
  path.forEach(p => {
    if (p.t === '买') {
      cash -= p.amt;
      shares += p.amt / p.price;
      invested += p.amt;
      out.push('在 ' + fmt(p.price) + ' 买入 ' + fmt(p.amt, 0) + ' 元 → 份额 ' + fmt(p.amt / p.price, 0));
    }
  });
  if (path.length === 0 || (target > cur && path[0].t === '卖')) {
    out.push('空仓上涨到 ' + fmt(target) + '：未触发任何买入（网格从下方档位开始建仓），无操作。');
  }
  const marketVal = shares * target;
  const float = marketVal - invested;
  const total = cash + marketVal + realized;
  const rows =
    '<div class="stat-row" style="margin-top:6px">' +
    '<div class="stat-box"><div class="n">' + fmt(cash, 0) + '</div><div class="l">剩余现金</div></div>' +
    '<div class="stat-box"><div class="n">' + fmt(shares, 0) + '</div><div class="l">持仓份额</div></div>' +
    '<div class="stat-box"><div class="n">' + fmt(marketVal, 0) + '</div><div class="l">持仓市值 @' + fmt(target) + '</div></div>' +
    '<div class="stat-box"><div class="n" style="color:' + (float >= 0 ? '#ef4444' : '#10b981') + '">' + (float >= 0 ? '+' : '') + fmt(float, 0) + '</div><div class="l">浮动盈亏</div></div>' +
    '<div class="stat-box"><div class="n">' + fmt(total, 0) + '</div><div class="l">总资产</div></div>' +
    '</div>';
  $('sim-out').innerHTML = '<div style="font-size:0.68rem;color:var(--text-secondary);line-height:1.9">' + out.join('<br>') + '</div>' + rows;
}

calc();

function toggleTheme(){var h=document.documentElement,n=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=n;localStorage.setItem('theme',n);location.reload()}
</script>
<script src="/shared/js/nav.js"></script>
<script>window.NAV_PREFIX='../..';Nav.init({brandIcon:'🧭',brandText:'指数投资',currentPage:'red-dividend'})</script>
</body>
</html>
