<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>回撤实验室 · 红利投资</title>
<link rel="stylesheet" href="/shared/css/hanako-glass.css">
<script src="/shared/js/api-client.js"></script>
<script src="/shared/js/echarts.min.js"></script>
<style>
body{background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:13px;margin:0;padding:24px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-family:var(--font-display);font-size:1.3rem;font-weight:400;color:var(--accent);margin:0 0 4px}
.sub{font-size:0.68rem;color:var(--muted);margin-bottom:20px}
.back{font-size:0.68rem;color:var(--muted);cursor:pointer;margin-bottom:12px;display:inline-block}
.back:hover{color:var(--accent)}
.ctrl{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ctrl label{font-size:0.72rem;color:var(--muted)}
.ctrl select,.ctrl input[type=range]{font-size:0.72rem}
.ctrl .val{font-size:0.9rem;font-weight:700;color:var(--accent);min-width:60px}
.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;flex:1;min-width:110px;text-align:center}
.stat-box .n{font-family:var(--font-display);font-size:1.2rem;font-weight:600}
.stat-box .l{font-size:0.58rem;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.chart-card .ct{font-size:0.75rem;font-weight:600;color:var(--accent);margin-bottom:8px}
.chart-card .cs{font-size:0.6rem;color:var(--muted);margin-top:4px}
.note{font-size:0.62rem;color:#f59e0b;margin-top:6px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← 返回红利投资</a>
  <h1>🔬 回撤实验室</h1>
  <div class="sub" id="meta">中证红利全收益 H00922 · 2018-01 起 · 20日去重 · 次日收盘买入</div>

  <div class="ctrl">
    <div><label>回撤口径</label><br><select id="mode" style="margin-top:4px">
      <option value="250">250日滚动</option>
      <option value="annual">年度（年初清零）</option>
    </select></div>
    <div><label>触发阈值</label><br>
      <input type="range" id="th" min="8" max="20" step="1" value="10" style="margin-top:6px;width:160px">
      <span class="val" id="th-val">10%</span>
    </div>
    <div style="font-size:0.62rem;color:var(--muted);flex:1">回测结论：250日滚动≥10% 是甜点区（32次/20日胜率75%）；年度口径不做规则（仅对比参考）</div>
  </div>

  <div id="stats-row"></div>
  <div id="charts"></div>
</div>

<script>
const API = API_BASE + '/api/market-scan/dividend-lab';
let isDark = document.documentElement.dataset.theme === 'dark';
const tx = isDark ? '#999' : '#6E6E6E';
const sp = isDark ? 'rgba(200,200,200,0.08)' : 'rgba(128,128,128,0.1)';

let chartInst = null;
async function load() {
  const mode = document.getElementById('mode').value;
  const threshold = parseInt(document.getElementById('th').value) / 100;
  document.getElementById('th-val').textContent = Math.round(threshold * 100) + '%';
  try {
    const d = await fetch(API + '?mode=' + mode + '&threshold=' + threshold).then(r => r.json());
    if (d.error) { document.getElementById('meta').textContent = '无数据'; return; }

    // 统计数字行
    const st = d.stats || {};
    const s20 = st['20'] || {}, s60 = st['60'] || {};
    const statsHtml = [
      ['<div class="n" style="color:#ef4444">' + (s20.n || 0) + '</div><div class="l">触发次数</div>'],
      ['<div class="n" style="color:#ef4444">' + (s20.winrate != null ? s20.winrate + '%' : '—') + '</div><div class="l">20日胜率</div>'],
      ['<div class="n" style="color:#ef4444">' + (s20.median != null ? s20.median + '%' : '—') + '</div><div class="l">20日中位收益</div>'],
      ['<div class="n" style="color:#ef4444">' + (s60.winrate != null ? s60.winrate + '%' : '—') + '</div><div class="l">60日胜率</div>'],
      ['<div class="n" style="color:#ef4444">' + (s60.median != null ? s60.median + '%' : '—') + '</div><div class="l">60日中位收益</div>']
    ].map(h => '<div class="stat-box">' + h + '</div>').join('');
    document.getElementById('stats-row').innerHTML = '<div class="stat-row">' + statsHtml + '</div>';

    // 图表：触发点 + 回撤曲线
    const dates = d.events.map(e => e.date);
    const dds = d.events.map(e => e.dd);
    const closes = d.events.map(e => e.close);
    const box = '<div class="chart-card"><div class="ct">⚡ 触发点（' + (mode === 'annual' ? '年度' : '250日') + '回撤 ≥' + Math.round(threshold*100) + '% · ' + s20.n + ' 次）</div><div id="chart-lab" style="height:300px"></div>' +
      '<div class="note">⚠️ 数据 2018-01 起（约 8.5 年）。15%/20% 高阈值触发次数少（≤9次），胜率可能失真。</div></div>';
    document.getElementById('charts').innerHTML = box;
    if (chartInst) chartInst.dispose();
    chartInst = echarts.init(document.getElementById('chart-lab'));
    chartInst.setOption({
      backgroundColor:'transparent', tooltip:{trigger:'axis'},
      grid:{left:'10%',right:'6%',top:12,bottom:40},
      xAxis:{type:'category',data:dates,axisLabel:{color:tx,fontSize:9,rotate:45},axisLine:{lineStyle:{color:sp}}},
      yAxis:[
        {type:'value',name:'回撤%',axisLabel:{color:tx,fontSize:9},splitLine:{lineStyle:{color:sp}}},
        {type:'value',name:'收盘',axisLabel:{color:tx,fontSize:9},splitLine:{show:false}}
      ],
      dataZoom:[{type:'inside'}],
      series:[
        {name:'回撤%',type:'bar',data:dds,barWidth:'40%',itemStyle:{color:p => p.value >= 15 ? '#ef4444' : (p.value >= 10 ? '#f59e0b' : '#8b8b90')},label:{show:true,position:'top',fontSize:9,color:tx,formatter:'{c}%'}},
        {name:'收盘',type:'line',yAxisIndex:1,data:closes,smooth:true,showSymbol:false,lineStyle:{color:'#539BF5',width:1.5}}
      ]
    });
  } catch(e) {
    document.getElementById('meta').textContent = '加载失败: ' + e.message;
  }
}

document.getElementById('mode').addEventListener('change', load);
document.getElementById('th').addEventListener('input', load);
load();
window.addEventListener('resize', () => { if (chartInst) chartInst.resize(); });

function toggleTheme(){var h=document.documentElement,n=h.dataset.theme==='dark'?'light':'dark';h.dataset.theme=n;localStorage.setItem('theme',n);location.reload()}
(function(){var s=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=s})();
</script>
<script src="/shared/js/nav.js"></script>
<script>Nav.init({brandIcon:'🔬',brandText:'回撤实验室',currentPage:'red-dividend'})</script>
</body>
</html>
