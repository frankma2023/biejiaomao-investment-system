# 杯柄形态放量突破检测引擎 V2 · 配置
# 文件: config/market/cup_handle_v2.yaml
# 规格: docs/product/杯柄形态突破检测引擎_产品需求书_v3.md
#
# 本文件是**精简后的规则集**（2026-09 重构）：15 条编号 + 1 条前提约束 `+`，一律收盘价口径。
# 引擎逻辑代码中不得出现任何魔法数字；本文件缺失或参数缺失时引擎必须报错。

cup_handle_v2:
  # ══ 结构准入（前高 H / 杯底 B / 杯口 M）══════════════
  min_prior_advance: 0.25         # 规则 1  前置涨幅 (H−L0)/L0 ≥ 此值
  require_bottom_above_origin: false  # 规则 2 开关。false = 取消「杯底 > 上涨起点」
                                  # 本次试验按用户要求关闭，观察信号量与质量变化。
                                  # 603903 正是被这条否决的（杯底 10.28 < 起点 11.01）
  advance_origin_tolerance: 0.01  # 规则 2  杯底允许跌破上涨起点 L0 的容差。
                                  # 相邻两笔共享转折点，报价噪声会造成「低于起点
                                  # 0.012 元」这类浮点级差异（003030 实测），
                                  # 严格 > 比较会误杀真杯底、反而留下 W 形浅读数
  mouth_vs_high_max: 1.00         # 规则 3  杯口不得高于前高（H ≥ M）。1.00 = 允许相等；
                                  # >1 表示允许杯口高于前高，那说明右侧已突破前高，
                                  # 不是杯子右侧的顶
  mouth_span_max: 100             # 规则 10 前高→杯口 最长交易日；调整拖太久就不是
                                  # 上涨过程中的整理
  depth_min: 0.12                 # 规则 4  杯身深度 (M−B)/M 下限。原 0.15；漏斗实测
                                  # 规则 4 通过率仅 24.2%，是最大瓶颈，按用户意见放宽
  depth_max: 0.40                 # 规则 4  上限。欧奈尔的「死亡酒碗」指深度过大，
                                  # 但 0.40 实测几乎不筛（漏斗通过率损失 <3%）
  recovery_dd_max: 0.15           # 规则 6  回升段（杯底→杯口）最大回撤上限，绝对值。
                                  # 杯身是「一跌一涨」两段；回升若被深度回调反复
                                  # 打断，就是多次反弹与下跌交替，已不是欧奈尔定义
                                  # 的杯子（003030 回升段最大回撤 27.4% → 否决）。
                                  # 注：规则 5 保证最大回撤 ≤ 深度，故 depth ≤ 0.15
                                  # 的杯身不可能触发本规则（几何必然）
  bottom_zone_pct: 0.03           # 规则 9  杯底区 = [B, B×(1+此值)]
  bottom_zone_days_max: 10        # 规则 9  杯底区内的交易日数上限（前后各）。
                                  # 在杯底附近磨太久就是平底/箱体，不是杯子
  bottom_zone_before_min: 0       # 规则 9  杯底【前侧】的交易日数下限。0 = 不限制，
                                  # 即允许 V 形反转（按用户意见，2026-09-26）。
                                  # 后侧本来就不设下限。取 0 时该分支不可达，但
                                  # n_before 仍会算——zone_before_days 输出字段在用。
                                  # 原设 2：漏斗实测通过率仅 11.3%，且 PRD §6.6 把
                                  # 「前侧 =0」标为期望最低档（+2.74%），属主动放宽
  mouth_lock_pullback: 0.03       # 柄部定义的前提：P ≤ M×(1−此值)，否则 M 不是顶

  # ══ 柄部 ═══════════════════════════════════════════
  handle_days_min: 3              # 规则 7b 柄部交易日数下限。柄部是「小幅回调 +
                                  # 缩量整理」，一天的回撤不构成柄部（001289 实测仅 1 日）
  handle_pm_min: 0.80             # 规则 7  柄低/杯口 ≥ 此值（即回撤 ≤ 20%）。
                                  # 0.92（≤8%）与 0.80（≤20%）信号集合相同（500 只样本
                                  # 实测），取更松者。收紧到 0.92 时样本内 +2.36% /
                                  # 样本外 +2.96%，>=8% 档只有 +0.13% / +0.67%。
                                  # 注：规则 8 的门槛 M×(1−depth/2) ≥ 0.80M 恒成立
                                  # （因 depth ≤ 0.40），本规则当前无独立约束力
  handle_position_ratio: 0.50     # 规则 8  柄低 ≥ 杯底 + 比例 ×（杯口 − 杯底）

  # ══ 突破 ═══════════════════════════════════════════
  mouth_to_signal_max: 12         # 规则 11 杯口→突破 最长交易日。口径修正后的逐日回放
                                  # 样本上各档 +2.24%~+2.57%（平坦，无区分度），
                                  # v2 的「★最强判据 50.9%→20.3%」来自笔的极值口径
                                  # 一次性扫描，已不成立
  buy_point_buffer: 0.01          # 规则 12 买点 = 杯口 + 此缓冲（元），O'Neil 原文
  breakout_vol_ratio: 2.00        # 规则 13 突破日量 / MA20(量)。样本外验证：
                                  # >=2.0 档样本内 +3.42% / 样本外 +3.26%，
                                  # [1.5,2.0) 档只有 +1.26% / +2.18%。
                                  # PRD §6.3 原本就是按 k=2.0 标定的
  vol_ma_window: 20               # 放量参照均量窗口
  require_breakout_confirm: true  # 规则 14 次日确认：突破日发 SIGNAL（轻仓，能吃到
                                  # 杯口价），次日收盘仍站在杯口之上再补一条 CONFIRM
                                  # （加仓点）。两条记录并存，不互相压制。
                                  # 参照《像欧奈尔信徒一样交易》的分批建仓做法

  # ══ 候选有效期 ═════════════════════════════════════
  cup_invalidate_tolerance: 0.02  # 收盘跌破 杯底×(1−此值) 即候选失效

  # ══ 输出：建议退出参数（标定期望最高档）══════════════
  suggested_tp: 0.15              # 止盈幅度：+2.18%/笔，胜率 49.7%，盈亏比 1.51
  suggested_sl: 0.10              # 止损幅度
  suggested_max_hold: 20          # 最长持有交易日

  # ══ 输出：仅记录、不参与判定 ════════════════════════
  voodoo_vol_ratio: 0.65          # 「巫毒日」判定：量 < 均量 × 此值
  bottom_amp_window: 5            # 杯底 ±N 日振幅统计窗口

  # ══ 其它过滤 ═══════════════════════════════════════
  min_market_cap: 0               # 流通市值下限（亿），0 = 关闭

  # ══ 持仓分流（由 discipline/monitoring 使用）═════════
  speed_rule_days: 15
  speed_rule_gain: 0.20
