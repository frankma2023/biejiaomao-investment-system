# 红利指数 RSI 买卖点参数 —— 详情页【操作建议】tab 的 RSI 图
#
# 口径：Wilder RSI（与 talib.RSI 逐点一致），收盘价，日线。
#       见 src/detectors/divergence.py: compute_rsi（2026-09 修掉差一错误）。
#
# ── 图上默认只显示 default_period 那条，其余点图例展开 ──────
# 每条曲线各自带自己的买点与卖点标记，标记随所属曲线一起显隐
# （已用 echarts 5.5.1 的 SSR 模式实测：markPoint/markLine/markArea 都跟随图例）。
#
# ── 为什么三条曲线的阈值不一样 ──────────────────────────────
# RSI14/RSI20 比 RSI6 平滑得多，本来就极少跌到 29：合并 9 只红利指数，
#   RSI6  5% 分位 = 21.2，中位 51.9
#   RSI14 5% 分位 = 32.1，中位 51.4
#   RSI20 5% 分位 = 35.6，中位 51.1
# 直接沿用 29 会让慢周期几乎不触发，三条线没法比较。所以按「触发频率对齐」
# 定阈值 —— 三条线在同一档位上稀疏度相同，质量才可比。
#
# ── 为什么是 6 / 14 / 20 这三个周期 ─────────────────────────
# 6 来自实战记录（红利低波50ETF 用 RSI6 做轮动）；14 是 Wilder 原始默认值；
# 20 是常用的月线级短周期。周期扫描（触发频率固定后比较）显示 **6~20 之间
# 几乎没有差别**：12% 频率下买点胜率 RSI6 71.3% / RSI8 72.2% / RSI10 72.4% /
# RSI14 71.8% / RSI20 70.7%，其中 1pp 级差异在噪声内（朴素标准误≈0.96pp，
# 且样本是重叠的日序列，真实误差更大）。所以：不要挑扫描出来的"最优"周期，
# 那是过拟合；三条都留着让使用者自己看，比选一个"最优"更诚实。
# 真正决定质量的是触发有多稀有，不是周期。
#
# ── 六档阈值的频率与后续收益验证（合并 9 只指数，60 日全收益口径）──
# 基准 = 任意一天 62.3% / +2.00%
# 下表是**互斥分档**口径（图上每档统计用的就是这个）：买点第 k 档 = [更深的阈值, 本档阈值)，
# 卖点第 k 档 = (本档阈值, 更深的阈值]。这样各档互不重叠，逐档可独立读。
#   周期 档位        区间          频率    胜率    中位      vs基准
#   6    买点        [20,29)       7.98%   69.9%  +2.73%    +7.6pp
#   6    强买点      [10,20)       3.67%   73.8%  +4.45%   +11.5pp
#   6    极强买点    [0,10)        0.45%   80.7%  +6.92%   +18.4pp
#   6    卖点        (81,89]       4.47%   55.9%  +0.91%    -6.4pp
#   6    强卖点      (89,93]       1.05%   46.6%  -0.59%   -15.7pp
#   6    极强卖点    (93,100]      0.44%   28.0%  -1.34%   -34.3pp
#   14   买点        [31,38)       8.82%   69.0%  +2.82%    +6.7pp
#   14   强买点      [24,31)       3.13%   75.0%  +4.35%   +12.7pp
#   14   极强买点    [0,24)        0.90%   81.8%  +8.03%   +19.5pp
#   14   卖点        (70,78]       4.80%   57.3%  +1.15%    -5.0pp
#   14   强卖点      (78,83]       1.01%   41.2%  -0.93%   -21.1pp
#   14   极强卖点    (83,100]      0.43%   16.2%  -4.15%   -46.1pp
#   20   买点        [35,40)       7.39%   68.0%  +2.74%    +5.7pp
#   20   强买点      [28,35)       3.52%   73.6%  +4.81%   +11.3pp
#   20   极强买点    [0,28)        0.96%   84.7%  +7.88%   +22.4pp
#   20   卖点        (67,73]       4.46%   59.5%  +1.61%    -2.8pp
#   20   强卖点      (73,78]       1.12%   36.6%  -1.41%   -25.7pp
#   20   极强卖点    (78,100]      0.44%   18.5%  -3.72%   -43.8pp
#
# 两侧都单调：买点越深越好，卖点越极端后续越差。都是按「状态」统计
# （落在档位内的所有交易日），图上标记则画在每段的最低点（买）/最高点（卖）。
#
# 口径提示：上表用的是"价格表与全收益表都有数据的日期交集"，接口/图表用的是
# "价格交易日 + 全收益按日期映射"。两者相差约 1pp（如极强买点 80.7% vs 81.4%），
# 方向与结论一致；以接口返回为准。
# 注意卖点侧长周期反而更灵敏：极强卖点档 RSI6 还有 28% 胜率，
# RSI14/RSI20 已降到 16%/18% —— 与买点侧（短周期更灵敏）相反。
# 实例：2024-10-08（9·24 暴涨后的情绪高点）RSI6 冲到 95.7 被标为极强卖点，
#       其后 20 日 -4.7%、60 日 -2.7%。
#
# 买点档内越深越好（按超卖段去重，9 只合并）：
#   买点 71.4%/+2.84%  ->  强买点 78.7%/+4.55%  ->  极强 82.2%/+6.80%
#   合并 Spearman(最低点 RSI, 60日收益) = -0.118 (p=0.001)，逐指数段内相关无一为正。
#
# 不同红利品种波动不同，要按品种调写在 overrides 里，整体替换 periods：
#   overrides:
#     "H30269":
#       periods: [...]
defaults:
  # 图上默认只显示这一条（其余靠点图例展开），见前端 legend.selected
  default_period: 6
  periods:
    - period: 6
      buy_tiers:
        - {threshold: 29, label: 买点,     short: 买}
        - {threshold: 20, label: 强买点,   short: 强}
        - {threshold: 10, label: 极强买点, short: 极强}
      sell_tiers:
        - {threshold: 81, label: 卖点,     short: 卖}
        - {threshold: 89, label: 强卖点,   short: 强卖}
        - {threshold: 93, label: 极强卖点, short: 极强卖}
    - period: 14
      buy_tiers:
        - {threshold: 38, label: 买点,     short: 买}
        - {threshold: 31, label: 强买点,   short: 强}
        - {threshold: 24, label: 极强买点, short: 极强}
      sell_tiers:
        - {threshold: 70, label: 卖点,     short: 卖}
        - {threshold: 78, label: 强卖点,   short: 强卖}
        - {threshold: 83, label: 极强卖点, short: 极强卖}
    - period: 20
      buy_tiers:
        - {threshold: 40, label: 买点,     short: 买}
        - {threshold: 35, label: 强买点,   short: 强}
        - {threshold: 28, label: 极强买点, short: 极强}
      sell_tiers:
        - {threshold: 67, label: 卖点,     short: 卖}
        - {threshold: 73, label: 强卖点,   short: 强卖}
        - {threshold: 78, label: 极强卖点, short: 极强卖}
overrides: {}
