# 红利指数 RSI 买点参数 —— 详情页【操作建议】tab 的 RSI 图
#
# 口径：Wilder RSI，收盘价，日线（src/detectors/divergence.py: compute_rsi）。
#
# 买点判定的口径（2026-09 修订）：
#   原规则是「RSI 从阈值上方下穿到阈值下方的那一天」。实测这个事件口径会系统性漏掉
#   每段超卖里最深、也最有价值的那几天（如 000922 在 2024-09-11 RSI6=7.59 未被标记），
#   因为同一段超卖里 RSI 再深也不会重复"下穿"。
#
#   改成「状态 + 深度分级」：只要 RSI 落在某个档位内，那些天都算该档买点窗口。
#   10 年全收益口径实测（60 日后续收益，胜率 / 中位）：
#     000922 中证红利  任意一天 64.6% / +1.86%  RSI6<29 79.9% / +4.26%
#     930955 红利低波100  任意一天 60.7% / +1.44%  RSI6<29 70.8% / +2.77%
#     H30269 红利低波   任意一天 63.8% / +1.97%  RSI6<29 78.5% / +3.68%
#     931468 红利质量   任意一天 59.6% / +2.04%  RSI6<29 64.6% / +5.44%
#   且中位收益随深度单调抬升（[20,29) -> [10,20)）：
#     000922 +3.39% -> +5.07% ; 930955 +1.91% -> +3.95%
#     H30269 +2.92% -> +5.20% ; 931468 +4.70% -> +7.34%
#
#   注意 tiers 的档位数（以 n 计）必须看：最深的 [0,10) 档 10 年里只有个位数天，
#   统计意义弱，只作参考，不要按它做仓位决策。
#
# 阈值来源：
#   period=6 / buy=29 / sell=81 —— 来自「红利低波50ETF 用 RSI6 做 50% 资金轮动」的实战记录。
#   period2=14 / buy2=30 / sell2=70 —— RSI14 通用超卖/超买线（本仓库 recommend.py 同口径）。
#
# 不同红利品种的波动幅度不同，RSI 阈值不能通用。要按品种调，写在 overrides 里，
# 只需给出要覆盖的键，其余继承 defaults：
#   overrides:
#     "H30269": {buy: 25, sell: 85, tiers: [{threshold: 25}, {threshold: 18}, {threshold: 10}]}
defaults:
  period: 6
  buy: 29
  sell: 81
  period2: 14
  buy2: 30
  sell2: 70
  # 深度分档，由浅到深。threshold 是 RSI 上界（含下方），label 用于图例与标注。
  tiers:
    - {threshold: 29, label: 买点}
    - {threshold: 20, label: 强买点}
    - {threshold: 10, label: 极值买点}
overrides: {}
