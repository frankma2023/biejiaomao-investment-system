# 跌破箱体检测引擎配置
# 参数说明见 docs/product/跌破箱体检测引擎_产品需求书.md
# 设计说明：卖出侧不设跌破容差（严格 收盘<下沿 即触发），也不检测成交量（阴跌比放量下跌更常见更阴险）
box_breakdown:
  lookback_days: 300       # 箱体识别窗口（交易日）
  band_tol: 0.03           # 带容差 ±3%
  touch_tol: 0.03          # 触碰容差
  min_touches: 3           # 上沿/下沿触碰最少天数
  box_min_days: 40         # 箱体最小跨度（交易日）
  max_box_days: 250        # 箱体最大跨度
  max_depth: 0.35          # 箱体最大深度（下沿距上沿比例）
  min_depth: 0.03          # 箱体最小深度
  local_window: 10         # 局部极值窗口
  min_lookback_days: 60    # 最少数据天数
  confirm_days: 2          # strong_sell 确认天数（连续跌破下沿）
