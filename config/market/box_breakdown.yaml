# 跌破箱体检测引擎配置
# 参数说明见 docs/product/跌破箱体检测引擎_产品需求书.md
# 设计说明（v1.5 用户语义）：跌破容差 1%（收盘<下沿×0.99 才算跌破，贴线不触发）；
# 次日收盘未收回（≤下沿）→ 确认 strong_sell → 箱体失效（之后反弹/再跌与箱体无关）
box_breakdown:
  lookback_days: 300       # 箱体识别窗口（交易日）
  band_tol: 0.03           # 带容差 ±3%
  touch_tol: 0.03          # 触碰容差
  min_touches: 3           # 上沿/下沿触碰最少天数（冻结需 ×3=9）
  box_min_days: 40         # 箱体最小跨度（交易日）
  max_box_days: 250        # 箱体最大跨度 + 失效窗口（确认跌破后同价位不再报，超期视为新箱体）
  max_depth: 0.35          # 箱体最大深度（下沿距上沿比例）
  min_depth: 0.03          # 箱体最小深度
  local_window: 10         # 局部极值窗口
  min_lookback_days: 60    # 最少数据天数
  break_tol: 0.01          # 跌破容差：收盘 < 下沿×(1-1%) 才算跌破（v1.5）
  confirm_days: 1          # 确认天数：1 = 次日收盘未收回即确认（v1.5 用户语义）
