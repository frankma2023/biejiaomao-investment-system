rules:
  sell_priority_mult: 1.5
  sell_fresh_days: 20
  position_limit: 85
  buy_min_net: 60
  buy_strong_net: 80
  buy_min_resonance: 2
  buy_strong_resonance: 3
  buy_position_ok: 60
  miss_gain_pct: 15
  new_signal_window: 60
  decay_after: 30
  decay_factor: 0.6
  ma50_down_ban: true
  stop_loss_pct: 8.0
  profit_take_pct: 25.0
  fib_levels:
  - 0.382
  - 0.5
  - 0.618
  callback_trigger_pct: 5.0
  hold_net_range:
  - 20
  - 60
  avoid_net: -30
