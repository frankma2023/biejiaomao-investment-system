# 自选池日报 · 信号权重表
# 方向：long=看多 / short=看空 · score：基础分 0~100
# source：expert=专家权重（欧奈尔优先级） / backtest=回测置信度
# 规则：sell_priority_mult 卖出优先放大 / position_limit 位置降级 / buy_min_net 买入门槛

signals:
  # ── 买入系 ──
  mw_b1:
    dir: long
    score: 55
    source: backtest
    note: "MW B1 主突破信号，可叠加 TS 置信度"
  mw_b2:
    dir: long
    score: 35
    source: backtest
    note: "MW B2 次级确认，置信度低于 B1"
  pocket_pivot:
    dir: long
    score: 50
    source: backtest
    note: "口袋支点（V1/V2），可叠加 PP 评分"
  base_breakout:
