    source: expert
    note: "基部突破 V2（欧奈尔 buy point）"
  base_breakout_v2:
    dir: long
    score: 45
    source: expert
    note: "基部突破 V2 引擎"
  box_breakout:
    dir: long
    score: 35
    source: expert
    note: "放量箱体突破"
  double_bottom:
    dir: long
    score: 30
    source: expert
  flat_base:
    dir: long
    score: 25
    source: expert
  cup_handle:
    dir: long
