      注：④ 样本偏向“已涨过一段的晚期突破”，不是中性样本。

    test_14_prior_gain:
      question: "PRD 前置要求：自最后一次有效入场点起涨幅 ≥20%（待校准）"
      method: "代理口径：箱体起点前 120 日内最低收盘 → 箱底 的涨幅"
      buckets:
