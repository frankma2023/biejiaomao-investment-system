          - {bucket: '>=100%', n: 78,  wr: '42%', mean: '+2.01%', median: '-2.44%'}
        mean_median_divergence: |
          **均值与中位给出相反信号**：
            · 均值单增（+0.06% → +2.01%）——高涨幅组有更大的右尾；
            · 中位单减（≥100% 组 −2.44% 最差）——高涨幅组是“大多数时候更差、少数时候好很多”的彩票型分布。
