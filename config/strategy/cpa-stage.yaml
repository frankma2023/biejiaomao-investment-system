        - {from: '③', n: 2052, wr: '40%', mean: '-1.07%'}
      note: "两类胜率相同，③ 来源的均值更差；样本量足够，不算显著"

    caveats:
      - "prior_gain 用的是“箱体起点前 120 日最低收盘 → 箱底”代理，与 PRD 原文“自最后一次有效入场点起”不完全一致（实际入场点未入库）"
      - "VCP 用的是箱体内部前后半段的区间/均量收缩比，是标准 VCP 的简化代理，不是涛波级收缩链（三次递缩）的完整实现"
