        verdict: |
          **保留 #14 的方向（限上界、低涨幅优先），但证据引用改为中位。**
          若未来进一步收紧，中位最优组是 **20~30%**（−1.34%），其次 <20%（−1.70%）。

      test_13_status: "新数据下方向仍成立：≤3% 中位 −0.98% / 均值 +0.70%，3~5% 中位 −2.01% / 均值 +0.13%"
      test_11_status: "新数据下 VCP 仍无区分力（四组胜率 43~44%，均值 −0.16%~+0.96%）→ 确认“不做 VCP”的决定"
