# 公众号文章抓取清单
#
# 说明：公众号本身没有「关注列表」接口，也没有免登录的文章列表接口。
# 本清单走**同作者在搜狐号的同步发布**，无需 cookie、无需登录。
# sohu_id 取自搜狐号个人主页 URL：mp.sohu.com/profile?xpt=<base64> 对应的 userId，
# 或任一文章页 URL 的 `_<数字>` 后缀（如 www.sohu.com/a/1100763948_120994993）。
# 想加新号：先在搜狐搜到该号的一篇文章，取 URL 末尾数字即可。
accounts:
  - name: 指汇盈
    gzh_id: ''            # 公众号原始 ID，暂不抓公众号原页，留空
    sohu_id: '120994993'
    enabled: true
